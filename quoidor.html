<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Quoridor 3D: 1v1 & 1v1v1v1</title>
  <script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.3/dist/mqtt.min.js"
          onerror="var s=document.createElement('script');s.src='https://unpkg.com/mqtt/dist/mqtt.min.js';document.head.appendChild(s);"></script>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --border: #334155;
      --accent: #f59e0b;
      --green: #22c55e;
      --blue: #38bdf8;
      --text: #f8fafc;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at center, #1e293b 0%, #090d16 100%);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: none;
    }

    .screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 14px;
      z-index: 20;
    }
    .hidden { display: none !important; }

    .card {
      background: rgba(30, 41, 59, 0.96);
      border: 2px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 45px rgba(0,0,0,0.65);
      text-align: center;
    }
    h1 {
      font-size: 1.65rem;
      font-weight: 900;
      color: var(--accent);
      margin-bottom: 4px;
    }
    .sub {
      font-size: 0.8rem;
      color: #94a3b8;
      margin-bottom: 14px;
    }
    .section-label {
      font-size: 0.76rem;
      font-weight: 800;
      color: #cbd5e1;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    /* COLOR SKIN SELECTOR */
    .skin-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
      margin-bottom: 14px;
    }
    .skin-btn {
      background: #0f172a;
      border: 2px solid #334155;
      border-radius: 10px;
      padding: 8px 6px;
      color: #cbd5e1;
      font-size: 0.78rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform 0.1s, border-color 0.1s;
    }
    .skin-btn.active {
      border-color: var(--accent);
      background: rgba(245, 158, 11, 0.16);
      color: #fff;
      transform: scale(1.03);
    }
    .swatch {
      width: 15px;
      height: 15px;
      border-radius: 50%;
      display: inline-block;
      box-shadow: inset -2px -2px 4px rgba(0,0,0,0.6), inset 2px 2px 3px rgba(255,255,255,0.65);
    }

    /* MODE PICKER (1v1 vs 1v1v1v1) */
    .mode-select-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }
    .mode-pill {
      padding: 10px;
      border-radius: 10px;
      border: 2px solid #334155;
      background: #0f172a;
      color: #94a3b8;
      font-weight: 900;
      font-size: 0.86rem;
      cursor: pointer;
    }
    .mode-pill.active {
      border-color: var(--accent);
      background: rgba(245, 158, 11, 0.18);
      color: var(--accent);
    }

    .divider {
      display: flex;
      align-items: center;
      margin: 14px 0;
      color: #64748b;
      font-size: 0.75rem;
      font-weight: 800;
    }
    .divider::before, .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #334155;
      margin: 0 10px;
    }

    .join-row {
      display: flex;
      gap: 8px;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 2px solid #475569;
      background: #0f172a;
      color: #fff;
      font-size: 1.05rem;
      font-weight: 800;
      text-align: center;
      outline: none;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    input:focus { border-color: var(--accent); }

    .btn {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: none;
      font-weight: 900;
      font-size: 0.92rem;
      cursor: pointer;
      background: var(--accent);
      color: #0f172a;
      transition: transform 0.1s;
    }
    .btn:active { transform: scale(0.96); }
    .btn-sec { background: #334155; color: #f8fafc; }
    .btn-green { background: var(--green); color: #052e16; }
    .btn-blue { background: var(--blue); color: #082f49; }

    /* LOBBY SCREEN */
    .code-box {
      background: #0f172a;
      border: 2px dashed var(--accent);
      border-radius: 12px;
      padding: 12px;
      font-size: 1.9rem;
      font-weight: 900;
      letter-spacing: 6px;
      color: var(--accent);
      margin: 10px 0;
      cursor: pointer;
    }
    .slot-list {
      list-style: none;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 8px;
      margin: 10px 0 14px;
      text-align: left;
    }
    .slot-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      border-bottom: 1px solid #1e293b;
      font-weight: 800;
      font-size: 0.88rem;
    }
    .slot-item:last-child { border-bottom: none; }

    /* GAMEPLAY SCREEN */
    #gameScreen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 6px 8px 10px;
    }
    .top-hud {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .meta-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.74rem;
      color: #94a3b8;
      padding: 0 2px;
    }
    .badge {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid #334155;
      padding: 3px 9px;
      border-radius: 99px;
      font-weight: 800;
      color: #e2e8f0;
    }

    .score-grid {
      display: grid;
      gap: 5px;
      background: rgba(30, 41, 59, 0.94);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 6px;
    }
    .score-grid.cols-2 { grid-template-columns: 1fr 1fr; }
    .score-grid.cols-4 { grid-template-columns: repeat(4, 1fr); }

    .p-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 4px 6px;
      border-radius: 8px;
      border: 2px solid transparent;
      background: rgba(15, 23, 42, 0.55);
    }
    .p-card.active {
      border-color: var(--accent);
      background: rgba(245, 158, 11, 0.16);
    }
    .p-title {
      font-weight: 900;
      font-size: 0.82rem;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .p-sub {
      font-size: 0.72rem;
      color: #cbd5e1;
      font-weight: 700;
    }

    #canvasContainer {
      position: relative;
      flex: 1;
      width: 100%;
      max-width: 520px;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      max-width: 100%;
      max-height: 100%;
      border-radius: 16px;
      box-shadow: 0 16px 38px rgba(0,0,0,0.75);
      touch-action: none;
    }

    #toast {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.96);
      border: 2px solid var(--accent);
      color: #fff;
      padding: 7px 14px;
      border-radius: 99px;
      font-size: 0.82rem;
      font-weight: 800;
      white-space: nowrap;
      pointer-events: none;
      z-index: 15;
    }

    .controls-wrap {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .toggle-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .mode-tab {
      padding: 11px;
      border-radius: 11px;
      border: 2px solid #334155;
      background: #1e293b;
      color: #94a3b8;
      font-weight: 900;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .mode-tab.active {
      border-color: var(--accent);
      background: var(--accent);
      color: #0f172a;
    }
    .wall-actions {
      display: grid;
      grid-template-columns: 1fr 1.6fr;
      gap: 8px;
    }
  </style>
</head>
<body>

  <!-- 1. MENU SCREEN -->
  <div id="menuScreen" class="screen">
    <div class="card">
      <h1>🏛️ QUORIDOR 3D</h1>
      <div class="sub">Auto P1–P4 Naming • 3D Skins • 1v1 & 1v1v1v1</div>

      <div class="section-label">1. Choose Your 3D Ball Color</div>
      <div class="skin-grid" id="skinGrid"></div>

      <div class="section-label">2. Select Room Mode (For Creating)</div>
      <div class="mode-select-row">
        <button class="mode-pill active" id="mode2Btn">⚔️ 1v1 (2 Players)</button>
        <button class="mode-pill" id="mode4Btn">🔥 1v1v1v1 (4 Players)</button>
      </div>

      <button class="btn" id="createRoomBtn">➕ CREATE NEW ROOM</button>

      <div class="divider">OR JOIN FRIEND'S CODE</div>

      <div class="join-row">
        <input id="codeInput" type="text" maxlength="4" placeholder="CODE" />
        <button class="btn btn-blue" id="joinRoomBtn" style="flex:0.75;">JOIN ➡️</button>
      </div>
    </div>
  </div>

  <!-- 2. SYNCED LOBBY SCREEN -->
  <div id="lobbyScreen" class="screen hidden">
    <div class="card">
      <h1 id="lobbyTitle">ROOM LOBBY</h1>
      <div class="sub">Tap code to copy • First to join = P1, P2, P3, P4</div>

      <div class="code-box" id="lobbyCodeBox">----</div>

      <ul class="slot-list" id="slotList"></ul>

      <div id="lobbyNetInfo" style="font-size:0.78rem; color:#94a3b8; margin-bottom:10px;">
        🟢 Syncing across Syria Multi-Broker Mesh...
      </div>

      <div style="display:flex; gap:8px;">
        <button class="btn btn-sec" id="leaveLobbyBtn">LEAVE</button>
        <button class="btn btn-green hidden" id="hostStartBtn">START MATCH 🚀</button>
      </div>
    </div>
  </div>

  <!-- 3. GAME SCREEN -->
  <div id="gameScreen" class="hidden">
    <div class="top-hud">
      <div class="meta-bar">
        <span class="badge" id="roomBadge">ROOM: ----</span>
        <span class="badge" id="turnBadge" style="color:#facc15;">TURN: P1</span>
        <span class="badge" id="meshBadge">🟢 Mesh OK</span>
        <button id="exitGameBtn" style="background:#334155;color:#fff;border:none;border-radius:8px;padding:3px 9px;font-weight:800;font-size:0.72rem;cursor:pointer;">EXIT</button>
      </div>

      <div class="score-grid cols-2" id="scoreGrid"></div>
    </div>

    <div id="canvasContainer">
      <div id="toast" class="hidden"></div>
      <canvas id="boardCanvas" width="548" height="548"></canvas>
    </div>

    <div class="controls-wrap">
      <div class="wall-actions hidden" id="wallActionRow">
        <button class="btn btn-sec" id="rotateBtn">🔄 ROTATE (H/V)</button>
        <button class="btn btn-green" id="placeWallBtn">✅ PLACE WALL</button>
      </div>
      <div class="toggle-row">
        <button class="mode-tab active" id="tabMove">🏃 MOVE PAWN</button>
        <button class="mode-tab" id="tabWall">🧱 WALL MODE</button>
      </div>
    </div>
  </div>

<script>
(() => {
  /* =========================================================
     1. SYRIA ZERO-VPN MULTI-BROKER MESH
  ========================================================= */
  const BROKERS = [
    { name: "Eclipse-443", url: "wss://mqtt.eclipseprojects.io:443/mqtt" },
    { name: "HiveMQ-EU",   url: "wss://broker.hivemq.com:8884/mqtt" },
    { name: "Mosquitto-EU",url: "wss://test.mosquitto.org:8081/mqtt" },
    { name: "EMQX",        url: "wss://broker.emqx.io:8084/mqtt" }
  ];

  /* =========================================================
     2. 3D BALL TEXTURE SKINS & BOARD ASSETS
  ========================================================= */
  const SKINS = [
    { name: "Sapphire", base: "#0284c7", hi: "#7dd3fc", dark: "#082f49", vein: "#ffffff" },
    { name: "Crimson",  base: "#e11d48", hi: "#fda4af", dark: "#4c0519", vein: "#fde047" },
    { name: "Emerald",  base: "#10b981", hi: "#6ee7b7", dark: "#064e3b", vein: "#ecfdf5" },
    { name: "Gold",     base: "#d97706", hi: "#fef08a", dark: "#451a03", vein: "#ffffff" },
    { name: "Amethyst", base: "#9333ea", hi: "#e9d5ff", dark: "#3b0764", vein: "#f0abfc" },
    { name: "Damascus", base: "#64748b", hi: "#f1f5f9", dark: "#0f172a", vein: "#cbd5e1" }
  ];

  // Spawn & Goal definitions for P1..P4
  const SLOT_CONFIG = [
    { role: 1, name: "P1", startX: 4, startY: 8, goalType: "row", goalVal: 0, arrow: "▲" }, // Bottom -> Top
    { role: 2, name: "P2", startX: 4, startY: 0, goalType: "row", goalVal: 8, arrow: "▼" }, // Top -> Bottom
    { role: 3, name: "P3", startX: 0, startY: 4, goalType: "col", goalVal: 8, arrow: "▶" }, // Left -> Right
    { role: 4, name: "P4", startX: 8, startY: 4, goalType: "col", goalVal: 0, arrow: "◀" }  // Right -> Left
  ];

  const ballTextures = [];
  let woodTexture = null;
  let tileTexture = null;

  function build3DAssets() {
    SKINS.forEach((sk, idx) => {
      const c = document.createElement("canvas");
      c.width = 128; c.height = 128;
      const g = c.getContext("2d");
      g.fillStyle = sk.base;
      g.fillRect(0, 0, 128, 128);

      for (let i = 0; i < 28; i++) {
        g.beginPath();
        g.strokeStyle = i % 2 === 0 ? sk.vein : sk.dark;
        g.globalAlpha = 0.28;
        g.lineWidth = 2.4;
        let x = (i * 19) % 128;
        g.moveTo(x, 0);
        for (let y = 16; y <= 128; y += 16) {
          g.lineTo(x + Math.sin((y + i * 21) * 0.08) * 16, y);
        }
        g.stroke();
      }
      ballTextures[idx] = c;
    });

    const wc = document.createElement("canvas");
    wc.width = 128; wc.height = 64;
    const wg = wc.getContext("2d");
    const grad = wg.createLinearGradient(0, 0, 0, 64);
    grad.addColorStop(0, "#d97706");
    grad.addColorStop(0.5, "#b45309");
    grad.addColorStop(1, "#78350f");
    wg.fillStyle = grad;
    wg.fillRect(0, 0, 128, 64);
    wg.strokeStyle = "rgba(45, 18, 4, 0.35)";
    wg.lineWidth = 1.5;
    for (let i = 0; i < 16; i++) {
      wg.beginPath();
      const y = (i * 4) % 64;
      wg.moveTo(0, y);
      wg.bezierCurveTo(40, y + 3, 85, y - 3, 128, y);
      wg.stroke();
    }
    woodTexture = wc;

    const tc = document.createElement("canvas");
    tc.width = 64; tc.height = 64;
    const tg = tc.getContext("2d");
    const tGrad = tg.createLinearGradient(0, 0, 64, 64);
    tGrad.addColorStop(0, "#27354f");
    tGrad.addColorStop(1, "#1b2538");
    tg.fillStyle = tGrad;
    tg.fillRect(0, 0, 64, 64);
    tileTexture = tc;
  }
  build3DAssets();

  /* =========================================================
     3. SOUND SYNTHESIS
  ========================================================= */
  let audioCtx = null;
  function playSfx(type) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === "move") {
        osc.type = "sine";
        osc.frequency.setValueAtTime(260, now);
        osc.frequency.exponentialRampToValueAtTime(520, now + 0.1);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.11);
        osc.start(now); osc.stop(now + 0.11);
      } else if (type === "wall") {
        osc.type = "triangle";
        osc.frequency.setValueAtTime(160, now);
        osc.frequency.exponentialRampToValueAtTime(70, now + 0.15);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.16);
        osc.start(now); osc.stop(now + 0.16);
      } else if (type === "snap") {
        osc.type = "sine";
        osc.frequency.setValueAtTime(600, now);
        gain.gain.setValueAtTime(0.06, now);
        gain.gain.linearRampToValueAtTime(0.005, now + 0.04);
        osc.start(now); osc.stop(now + 0.04);
      } else if (type === "err") {
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(130, now);
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.14);
        osc.start(now); osc.stop(now + 0.14);
      } else if (type === "win") {
        osc.type = "triangle";
        osc.frequency.setValueAtTime(330, now);
        osc.frequency.setValueAtTime(490, now + 0.12);
        osc.frequency.setValueAtTime(660, now + 0.25);
        gain.gain.setValueAtTime(0.28, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.48);
        osc.start(now); osc.stop(now + 0.48);
      }
    } catch (_) {}
  }

  /* =========================================================
     4. STATE & GEOMETRY
  ========================================================= */
  const canvas = document.getElementById("boardCanvas");
  const ctx = canvas.getContext("2d");

  const GRID = 9;
  const PAD = 36;
  const CELL = 44;
  const GAP = 10;
  const STEP = CELL + GAP; // 54px
  const WALL_H_3D = 14;

  const myId = "u_" + Math.random().toString(36).substring(2, 9);
  let mySkin = 0;
  let createMaxPlayers = 2; // 2 (1v1) or 4 (1v1v1v1)
  let roomCode = "";
  let isHost = false;
  let myRole = 1; // 1..4
  let currentScreen = "MENU"; // MENU | LOBBY | GAME

  // Networking
  let clients = [];
  let connectedBrokers = [];
  let seenUids = new Set();
  let heartbeatTimer = null;

  // Lobby Roster: Array of { id, skin, joinedAt }
  let lobbyPeers = {};

  // Match State
  let state = {
    seq: 0,
    maxPlayers: 2,
    turnIndex: 0, // 0..(maxPlayers-1)
    winnerRole: 0,
    players: [], // [{ role, name, id, skin, x, y, walls, score, goalType, goalVal, arrow }]
    walls: []    // [{ gx, gy, dir }]
  };

  // Visual 3D Ball Interpolation per role (1..4)
  let anim = {
    1: { rx: 4, ry: 8, hop: 0, roll: 0 },
    2: { rx: 4, ry: 0, hop: 0, roll: 0 },
    3: { rx: 0, ry: 4, hop: 0, roll: 0 },
    4: { rx: 8, ry: 4, hop: 0, roll: 0 }
  };

  let mode = "MOVE";
  let previewWall = null;

  if (window.Telegram?.WebApp) {
    window.Telegram.WebApp.expand();
  }

  /* =========================================================
     5. MENU UI (COLOR PICKER & MODE SELECTOR)
  ========================================================= */
  const skinGrid = document.getElementById("skinGrid");
  SKINS.forEach((sk, idx) => {
    const btn = document.createElement("button");
    btn.className = "skin-btn" + (idx === 0 ? " active" : "");
    btn.innerHTML = `<span class="swatch" style="background:${sk.base}"></span><span>${sk.name}</span>`;
    btn.onclick = () => {
      mySkin = idx;
      document.querySelectorAll(".skin-btn").forEach((b, i) => b.classList.toggle("active", i === idx));
    };
    skinGrid.appendChild(btn);
  });

  document.getElementById("mode2Btn").onclick = () => {
    createMaxPlayers = 2;
    document.getElementById("mode2Btn").classList.add("active");
    document.getElementById("mode4Btn").classList.remove("active");
  };
  document.getElementById("mode4Btn").onclick = () => {
    createMaxPlayers = 4;
    document.getElementById("mode4Btn").classList.add("active");
    document.getElementById("mode2Btn").classList.remove("active");
  };

  function generateCode() {
    const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    let res = "";
    for (let i = 0; i < 4; i++) res += chars[Math.floor(Math.random() * chars.length)];
    return res;
  }

  document.getElementById("createRoomBtn").onclick = () => {
    roomCode = generateCode();
    isHost = true;
    state.maxPlayers = createMaxPlayers;
    lobbyPeers = {};
    lobbyPeers[myId] = { id: myId, skin: mySkin, joinedAt: 1 }; // Host is always #1 (P1)
    openLobby();
  };

  document.getElementById("joinRoomBtn").onclick = () => {
    const code = document.getElementById("codeInput").value.trim().toUpperCase();
    if (code.length < 2) {
      document.getElementById("codeInput").focus();
      return;
    }
    roomCode = code;
    isHost = false;
    lobbyPeers = {};
    lobbyPeers[myId] = { id: myId, skin: mySkin, joinedAt: Date.now() };
    openLobby();
  };

  document.getElementById("lobbyCodeBox").onclick = () => {
    navigator.clipboard?.writeText(roomCode);
    document.getElementById("lobbyNetInfo").textContent = "✅ Code copied to clipboard!";
  };

  document.getElementById("leaveLobbyBtn").onclick = () => {
    stopMesh();
    showScreen("MENU");
  };

  document.getElementById("exitGameBtn").onclick = () => {
    stopMesh();
    showScreen("MENU");
  };

  document.getElementById("hostStartBtn").onclick = () => {
    if (!isHost) return;
    hostInitializeAndStartMatch();
  };

  function showScreen(name) {
    currentScreen = name;
    document.getElementById("menuScreen").classList.toggle("hidden", name !== "MENU");
    document.getElementById("lobbyScreen").classList.toggle("hidden", name !== "LOBBY");
    document.getElementById("gameScreen").classList.toggle("hidden", name !== "GAME");
  }

  /* =========================================================
     6. BULLETPROOF ROOM CODE & LOBBY HEARTBEAT PROTOCOL
  ========================================================= */
  function openLobby() {
    showScreen("LOBBY");
    document.getElementById("lobbyCodeBox").textContent = roomCode;
    renderLobbySlots();
    startMesh();
  }

  function stopMesh() {
    if (heartbeatTimer) clearInterval(heartbeatTimer);
    heartbeatTimer = null;
    clients.forEach(c => { try { c.end(true); } catch (_) {} });
    clients = [];
    connectedBrokers = [];
  }

  function startMesh() {
    stopMesh();
    seenUids.clear();
    const topic = `quoridor_3d_v3_${roomCode}`;

    BROKERS.forEach(b => {
      try {
        const c = mqtt.connect(b.url, {
          clientId: `${myId}_${b.name}_${Math.floor(Math.random() * 999)}`,
          keepalive: 25,
          clean: true,
          connectTimeout: 5000,
          reconnectPeriod: 2000
        });

        c.on("connect", () => {
          if (!connectedBrokers.includes(b.name)) {
            connectedBrokers.push(b.name);
            updateNetBadges();
          }
          c.subscribe(topic, { qos: 0 }, () => {
            broadcastLobbyPresence();
          });
        });

        c.on("close", () => {
          connectedBrokers = connectedBrokers.filter(x => x !== b.name);
          updateNetBadges();
        });

        c.on("message", (_, payload) => {
          try {
            onMeshMessage(JSON.parse(payload.toString()));
          } catch (_) {}
        });

        clients.push(c);
      } catch (_) {}
    });

    // Continuous 1.0s Lobby Heartbeat so room codes NEVER fail or miss a joiner
    heartbeatTimer = setInterval(() => {
      if (currentScreen === "LOBBY") {
        broadcastLobbyPresence();
      } else if (currentScreen === "GAME" && isHost) {
        // Host periodically broadcasts state snapshot so late packets self-heal
        sendMesh({ t: "state", state });
      }
    }, 1000);
  }

  function updateNetBadges() {
    const txt = connectedBrokers.length > 0
      ? `🟢 Connected (${connectedBrokers[0]})`
      : `🔴 Reconnecting...`;
    document.getElementById("lobbyNetInfo").textContent = txt;
    document.getElementById("meshBadge").textContent = txt;
  }

  function sendMesh(pkt) {
    pkt.uid = myId + "_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6);
    seenUids.add(pkt.uid);
    const raw = JSON.stringify(pkt);
    const topic = `quoridor_3d_v3_${roomCode}`;
    clients.forEach(c => {
      if (c && c.connected) {
        try { c.publish(topic, raw, { qos: 0 }); } catch (_) {}
      }
    });
  }

  function broadcastLobbyPresence() {
    if (isHost) {
      sendMesh({
        t: "lobby_host",
        hostId: myId,
        maxPlayers: state.maxPlayers,
        peers: lobbyPeers
      });
    } else {
      sendMesh({
        t: "lobby_join",
        id: myId,
        skin: mySkin,
        joinedAt: lobbyPeers[myId]?.joinedAt || Date.now()
      });
    }
  }

  function onMeshMessage(msg) {
    if (!msg || !msg.uid || seenUids.has(msg.uid)) return;
    seenUids.add(msg.uid);

    // 1. Guest receives Host's authoritative lobby table
    if (msg.t === "lobby_host") {
      if (!isHost) {
        state.maxPlayers = msg.maxPlayers;
        const merged = { ...msg.peers };
        if (!merged[myId]) {
          merged[myId] = { id: myId, skin: mySkin, joinedAt: Date.now() };
          broadcastLobbyPresence();
        }
        lobbyPeers = merged;
        renderLobbySlots();
      }
      return;
    }

    // 2. Host receives a Guest's join/heartbeat
    if (msg.t === "lobby_join") {
      if (isHost) {
        const currentCount = Object.keys(lobbyPeers).length;
        if (!lobbyPeers[msg.id] && currentCount < state.maxPlayers) {
          lobbyPeers[msg.id] = {
            id: msg.id,
            skin: msg.skin,
            joinedAt: Date.now()
          };
          renderLobbySlots();
          broadcastLobbyPresence();

          // Auto-start immediately when room hits full capacity (2/2 or 4/4)
          if (Object.keys(lobbyPeers).length === state.maxPlayers && currentScreen === "LOBBY") {
            setTimeout(() => {
              if (currentScreen === "LOBBY") hostInitializeAndStartMatch();
            }, 500);
          }
        } else if (lobbyPeers[msg.id]) {
          lobbyPeers[msg.id].skin = msg.skin;
          renderLobbySlots();
        }
      }
      return;
    }

    // 3. Match State / Start Broadcast
    if (msg.t === "state") {
      const inc = msg.state;
      if (!inc) return;

      // Transition from Lobby to Game automatically when match starts
      if (currentScreen === "LOBBY") {
        state = inc;
        assignMyRoleFromState();
        resetAnimPositions();
        showScreen("GAME");
        document.getElementById("roomBadge").textContent = `ROOM: ${roomCode}`;
        updateGameHud();
        showToast(`🚀 Match Started! You are P${myRole}`);
        return;
      }

      if (inc.seq <= state.seq) return;

      const moved = inc.players.some((p, i) =>
        !state.players[i] || p.x !== state.players[i].x || p.y !== state.players[i].y
      );
      const walled = inc.walls.length > state.walls.length;

      state = inc;
      assignMyRoleFromState();

      if (moved) {
        state.players.forEach(p => { anim[p.role].hop = 1; });
        playSfx("move");
      } else if (walled) {
        playSfx("wall");
      }

      if (state.winnerRole) {
        playSfx("win");
        showToast(`🏆 P${state.winnerRole} WINS THE ROUND!`);
      }
      updateGameHud();
    }
  }

  function renderLobbySlots() {
    const sorted = Object.values(lobbyPeers).sort((a, b) => a.joinedAt - b.joinedAt);
    const listEl = document.getElementById("slotList");
    listEl.innerHTML = "";

    document.getElementById("lobbyTitle").textContent =
      state.maxPlayers === 4 ? "1v1v1v1 LOBBY (4P)" : "1v1 LOBBY (2P)";

    for (let i = 0; i < state.maxPlayers; i++) {
      const peer = sorted[i];
      const li = document.createElement("li");
      li.className = "slot-item";
      const pLabel = `P${i + 1}`;
      const cfg = SLOT_CONFIG[i];

      if (peer) {
        const sk = SKINS[peer.skin] || SKINS[0];
        const isMe = peer.id === myId;
        li.innerHTML = `
          <span style="display:flex;align-items:center;gap:8px;">
            <span class="swatch" style="background:${sk.base}"></span>
            <span>${pLabel} ${isMe ? "(You)" : ""}</span>
          </span>
          <span style="color:#4ade80;">Ready ${cfg.arrow}</span>
        `;
      } else {
        li.innerHTML = `
          <span style="color:#64748b;">⚪ ${pLabel} — Waiting...</span>
          <span style="color:#64748b;">${cfg.arrow}</span>
        `;
      }
      listEl.appendChild(li);
    }

    const startBtn = document.getElementById("hostStartBtn");
    if (isHost && sorted.length === state.maxPlayers) {
      startBtn.classList.remove("hidden");
    } else {
      startBtn.classList.add("hidden");
    }
  }

  function hostInitializeAndStartMatch(keepScores = false) {
    const sorted = Object.values(lobbyPeers).sort((a, b) => a.joinedAt - b.joinedAt);
    const count = state.maxPlayers;
    const wallsPerPlayer = count === 4 ? 5 : 10;

    // Ensure distinct colors if two players picked the exact same swatch
    const usedSkins = new Set();
    const playersArr = [];

    for (let i = 0; i < count; i++) {
      const peer = sorted[i] || { id: "bot_" + i, skin: i };
      let chosenSkin = peer.skin;
      if (usedSkins.has(chosenSkin)) {
        for (let s = 0; s < SKINS.length; s++) {
          if (!usedSkins.has(s)) { chosenSkin = s; break; }
        }
      }
      usedSkins.add(chosenSkin);

      const cfg = SLOT_CONFIG[i];
      const prevScore = keepScores && state.players[i] ? state.players[i].score : 0;

      playersArr.push({
        role: cfg.role,
        name: cfg.name, // Strictly P1, P2, P3, P4 in join order
        id: peer.id,
        skin: chosenSkin,
        x: cfg.startX,
        y: cfg.startY,
        walls: wallsPerPlayer,
        score: prevScore,
        goalType: cfg.goalType,
        goalVal: cfg.goalVal,
        arrow: cfg.arrow
      });
    }

    state = {
      seq: (state.seq || 0) + 1,
      maxPlayers: count,
      turnIndex: 0,
      winnerRole: 0,
      players: playersArr,
      walls: []
    };

    assignMyRoleFromState();
    resetAnimPositions();
    setMode("MOVE");
    showScreen("GAME");
    document.getElementById("roomBadge").textContent = `ROOM: ${roomCode}`;
    updateGameHud();
    sendMesh({ t: "state", state });
  }

  function assignMyRoleFromState() {
    const me = state.players.find(p => p.id === myId);
    if (me) myRole = me.role;
  }

  function resetAnimPositions() {
    state.players.forEach(p => {
      anim[p.role] = { rx: p.x, ry: p.y, hop: 0, roll: 0 };
    });
  }

  /* =========================================================
     7. QUORIDOR 2P & 4P RULES (MULTI-PAWN JUMP + 4-WAY BFS)
  ========================================================= */
  function isEdgeBlocked(x1, y1, x2, y2, wallList) {
    if (x2 < 0 || x2 >= GRID || y2 < 0 || y2 >= GRID) return true;
    if (x1 === x2 && Math.abs(y1 - y2) === 1) {
      const minY = Math.min(y1, y2);
      return wallList.some(w => w.dir === "H" && w.gy === minY && (w.gx === x1 || w.gx === x1 - 1));
    }
    if (y1 === y2 && Math.abs(x1 - x2) === 1) {
      const minX = Math.min(x1, x2);
      return wallList.some(w => w.dir === "V" && w.gx === minX && (w.gy === y1 || w.gy === y1 - 1));
    }
    return true;
  }

  function isCellOccupied(x, y, ignoreRole = 0) {
    return state.players.some(p => p.role !== ignoreRole && p.x === x && p.y === y);
  }

  function playerHasPath(p, wallList) {
    const visited = new Uint8Array(81);
    const q = [{ x: p.x, y: p.y }];
    visited[p.y * 9 + p.x] = 1;
    let head = 0;
    const dirs = [[0, -1], [0, 1], [-1, 0], [1, 0]];

    while (head < q.length) {
      const cur = q[head++];
      if (p.goalType === "row" && cur.y === p.goalVal) return true;
      if (p.goalType === "col" && cur.x === p.goalVal) return true;

      for (const [dx, dy] of dirs) {
        const nx = cur.x + dx, ny = cur.y + dy;
        if (nx >= 0 && nx < 9 && ny >= 0 && ny < 9) {
          const idx = ny * 9 + nx;
          if (!visited[idx] && !isEdgeBlocked(cur.x, cur.y, nx, ny, wallList)) {
            visited[idx] = 1;
            q.push({ x: nx, y: ny });
          }
        }
      }
    }
    return false;
  }

  function getValidPawnMoves(p) {
    if (!p) return [];
    const out = [];
    const dirs = [[0, -1], [0, 1], [-1, 0], [1, 0]];

    for (const [dx, dy] of dirs) {
      const nx = p.x + dx, ny = p.y + dy;
      if (isEdgeBlocked(p.x, p.y, nx, ny, state.walls)) continue;

      if (!isCellOccupied(nx, ny, p.role)) {
        out.push({ x: nx, y: ny });
      } else {
        // Neighbor has a pawn -> Try straight jump over it
        const jx = nx + dx, jy = ny + dy;
        if (!isEdgeBlocked(nx, ny, jx, jy, state.walls) && !isCellOccupied(jx, jy, p.role)) {
          out.push({ x: jx, y: jy });
        } else {
          // Straight jump blocked by wall, board edge, or 3rd pawn -> Diagonal jumps
          const sides = dx === 0 ? [[-1, 0], [1, 0]] : [[0, -1], [0, 1]];
          for (const [sdx, sdy] of sides) {
            const sx = nx + sdx, sy = ny + sdy;
            if (!isEdgeBlocked(nx, ny, sx, sy, state.walls) && !isCellOccupied(sx, sy, p.role)) {
              out.push({ x: sx, y: sy });
            }
          }
        }
      }
    }
    return out;
  }

  function validateWall(gx, gy, dir) {
    if (gx < 0 || gx > 7 || gy < 0 || gy > 7) return { ok: false, msg: "Out of bounds" };
    const activeP = state.players[state.turnIndex];
    if (!activeP || activeP.walls <= 0) return { ok: false, msg: "0 walls remaining!" };

    for (const w of state.walls) {
      if (w.gx === gx && w.gy === gy) return { ok: false, msg: "Intersects existing wall!" };
      if (dir === "H" && w.dir === "H" && w.gy === gy && Math.abs(w.gx - gx) <= 1) {
        return { ok: false, msg: "Overlaps horizontal wall!" };
      }
      if (dir === "V" && w.dir === "V" && w.gx === gx && Math.abs(w.gy - gy) <= 1) {
        return { ok: false, msg: "Overlaps vertical wall!" };
      }
    }

    const nextWalls = [...state.walls, { gx, gy, dir }];
    for (const p of state.players) {
      if (!playerHasPath(p, nextWalls)) {
        return { ok: false, msg: `Cannot completely block ${p.name}!` };
      }
    }
    return { ok: true };
  }

  /* =========================================================
     8. CONTROLS & TURN EXECUTION
  ========================================================= */
  function getActivePlayer() {
    return state.players[state.turnIndex] || null;
  }

  function isMyTurn() {
    const active = getActivePlayer();
    return !state.winnerRole && active && active.role === myRole;
  }

  function setMode(newMode) {
    mode = newMode;
    document.getElementById("tabMove").classList.toggle("active", mode === "MOVE");
    document.getElementById("tabWall").classList.toggle("active", mode === "WALL");
    document.getElementById("wallActionRow").classList.toggle("hidden", mode !== "WALL");

    if (mode === "MOVE") {
      previewWall = null;
    } else if (!previewWall) {
      previewWall = { gx: 3, gy: 3, dir: "H" };
    }
  }

  document.getElementById("tabMove").onclick = () => setMode("MOVE");
  document.getElementById("tabWall").onclick = () => {
    const me = state.players.find(p => p.role === myRole);
    if (!me || me.walls <= 0) {
      playSfx("err");
      showToast("⚠️ You have 0 walls left!");
      return;
    }
    setMode("WALL");
  };

  document.getElementById("rotateBtn").onclick = () => {
    if (!previewWall) return;
    previewWall.dir = previewWall.dir === "H" ? "V" : "H";
    playSfx("snap");
  };

  document.getElementById("placeWallBtn").onclick = () => {
    if (!previewWall) return;
    if (!isMyTurn()) {
      playSfx("err");
      showToast(`⏳ Wait for P${getActivePlayer()?.role}'s turn!`);
      return;
    }

    const check = validateWall(previewWall.gx, previewWall.gy, previewWall.dir);
    if (!check.ok) {
      playSfx("err");
      showToast(`⚠️ ${check.msg}`);
      return;
    }

    const activeP = getActivePlayer();
    activeP.walls -= 1;
    state.walls.push({ ...previewWall });
    state.turnIndex = (state.turnIndex + 1) % state.players.length;
    state.seq += 1;

    playSfx("wall");
    setMode("MOVE");
    updateGameHud();
    sendMesh({ t: "state", state });
  };

  let isDraggingWall = false;

  function getCanvasCoords(e) {
    const r = canvas.getBoundingClientRect();
    return {
      cx: (e.clientX - r.left) * (canvas.width / r.width),
      cy: (e.clientY - r.top) * (canvas.height / r.height)
    };
  }

  function updateWallPreview(cx, cy, allowFlip) {
    const rawX = (cx - PAD - CELL - GAP / 2) / STEP;
    const rawY = (cy - PAD - CELL - GAP / 2) / STEP;
    const gx = Math.max(0, Math.min(7, Math.round(rawX)));
    const gy = Math.max(0, Math.min(7, Math.round(rawY)));

    const ix = PAD + gx * STEP + CELL + GAP / 2;
    const iy = PAD + gy * STEP + CELL + GAP / 2;
    const dx = Math.abs(cx - ix);
    const dy = Math.abs(cy - iy);

    if (allowFlip && previewWall && previewWall.gx === gx && previewWall.gy === gy && dx < 22 && dy < 22) {
      previewWall.dir = previewWall.dir === "H" ? "V" : "H";
      playSfx("snap");
      return;
    }

    let dir = previewWall ? previewWall.dir : "H";
    if (dx > dy + 8) dir = "H";
    else if (dy > dx + 8) dir = "V";

    if (!previewWall || previewWall.gx !== gx || previewWall.gy !== gy || previewWall.dir !== dir) {
      previewWall = { gx, gy, dir };
      playSfx("snap");
    }
  }

  canvas.addEventListener("pointerdown", e => {
    e.preventDefault();
    const { cx, cy } = getCanvasCoords(e);

    if (mode === "MOVE") {
      const col = Math.floor((cx - PAD) / STEP);
      const row = Math.floor((cy - PAD) / STEP);
      if (col >= 0 && col < 9 && row >= 0 && row < 9) {
        tryMovePawn(col, row);
      }
    } else {
      isDraggingWall = true;
      updateWallPreview(cx, cy, true);
    }
  });

  canvas.addEventListener("pointermove", e => {
    if (!isDraggingWall || mode !== "WALL") return;
    const { cx, cy } = getCanvasCoords(e);
    updateWallPreview(cx, cy, false);
  });

  window.addEventListener("pointerup", () => { isDraggingWall = false; });

  function tryMovePawn(col, row) {
    if (!isMyTurn()) {
      playSfx("err");
      showToast(`⏳ Wait for P${getActivePlayer()?.role}'s turn!`);
      return;
    }

    const activeP = getActivePlayer();
    const valid = getValidPawnMoves(activeP);
    if (!valid.some(m => m.x === col && m.y === row)) return;

    activeP.x = col;
    activeP.y = row;
    anim[activeP.role].hop = 1;

    const reachedGoal =
      (activeP.goalType === "row" && activeP.y === activeP.goalVal) ||
      (activeP.goalType === "col" && activeP.x === activeP.goalVal);

    if (reachedGoal) {
      state.winnerRole = activeP.role;
      activeP.score += 1;
      playSfx("win");
      showToast(`🏆 ${activeP.name} WINS THE ROUND!`);
      if (isHost) {
        setTimeout(() => {
          hostInitializeAndStartMatch(true);
        }, 3200);
      }
    } else {
      state.turnIndex = (state.turnIndex + 1) % state.players.length;
      playSfx("move");
    }

    state.seq += 1;
    updateGameHud();
    sendMesh({ t: "state", state });
  }

  function updateGameHud() {
    const grid = document.getElementById("scoreGrid");
    grid.className = "score-grid " + (state.players.length === 4 ? "cols-4" : "cols-2");
    grid.innerHTML = "";

    const activeP = getActivePlayer();

    state.players.forEach(p => {
      const sk = SKINS[p.skin] || SKINS[0];
      const div = document.createElement("div");
      div.className = "p-card" + (activeP && activeP.role === p.role && !state.winnerRole ? " active" : "");
      div.innerHTML = `
        <div class="p-title" style="color:${sk.hi}">
          <span class="swatch" style="width:10px;height:10px;background:${sk.base}"></span>
          <span>${p.name}${p.role === myRole ? "*" : ""}${p.arrow}</span>
        </div>
        <div class="p-sub">🧱${p.walls} • 🏆${p.score}</div>
      `;
      grid.appendChild(div);
    });

    const tb = document.getElementById("turnBadge");
    if (state.winnerRole) {
      tb.textContent = `🏆 P${state.winnerRole} WON!`;
    } else if (activeP) {
      tb.textContent = activeP.role === myRole ? `⚡ YOUR TURN (P${myRole})` : `⏳ TURN: ${activeP.name}`;
    }
  }

  let toastTimer = null;
  function showToast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.remove("hidden");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.add("hidden"), 2500);
  }

  /* =========================================================
     9. 3D RENDERING ENGINE (4-SIDE GOALS + BALLS + WALLS)
  ========================================================= */
  function renderLoop() {
    if (currentScreen === "GAME") {
      state.players.forEach(p => {
        const a = anim[p.role];
        if (!a) return;
        a.rx += (p.x - a.rx) * 0.25;
        a.ry += (p.y - a.ry) * 0.25;
        a.hop *= 0.84;
        a.roll += Math.hypot(p.x - a.rx, p.y - a.ry) * 14;
      });
      draw3DBoard();
    }
    requestAnimationFrame(renderLoop);
  }
  requestAnimationFrame(renderLoop);

  function draw3DBoard() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 3D Outer Frame
    ctx.fillStyle = "#090d16";
    ctx.beginPath();
    ctx.roundRect(12, 16, canvas.width - 24, canvas.height - 22, 18);
    ctx.fill();

    ctx.fillStyle = "#1e293b";
    ctx.beginPath();
    ctx.roundRect(12, 10, canvas.width - 24, canvas.height - 24, 18);
    ctx.fill();
    ctx.strokeStyle = "#475569";
    ctx.lineWidth = 2;
    ctx.stroke();

    // Goal Edge Labels for Active Players
    ctx.font = "bold 11px sans-serif";
    ctx.textAlign = "center";
    const p1 = state.players[0];
    const p2 = state.players[1];
    const p3 = state.players[2];
    const p4 = state.players[3];

    if (p1) {
      ctx.fillStyle = SKINS[p1.skin].hi;
      ctx.fillText(`▲ P1 GOAL ▲`, canvas.width / 2, 26);
    }
    if (p2) {
      ctx.fillStyle = SKINS[p2.skin].hi;
      ctx.fillText(`▼ P2 GOAL ▼`, canvas.width / 2, canvas.height - 18);
    }
    if (p3) {
      ctx.save();
      ctx.translate(canvas.width - 20, canvas.height / 2);
      ctx.rotate(Math.PI / 2);
      ctx.fillStyle = SKINS[p3.skin].hi;
      ctx.fillText(`▲ P3 GOAL ▲`, 0, 0);
      ctx.restore();
    }
    if (p4) {
      ctx.save();
      ctx.translate(20, canvas.height / 2);
      ctx.rotate(-Math.PI / 2);
      ctx.fillStyle = SKINS[p4.skin].hi;
      ctx.fillText(`▲ P4 GOAL ▲`, 0, 0);
      ctx.restore();
    }

    const activeP = getActivePlayer();
    const validMoves = isMyTurn() && mode === "MOVE" ? getValidPawnMoves(activeP) : [];

    // Draw 9x9 Carved 3D Tiles
    for (let r = 0; r < GRID; r++) {
      for (let c = 0; c < GRID; c++) {
        const tx = PAD + c * STEP;
        const ty = PAD + r * STEP;

        ctx.fillStyle = "#0b0f19";
        ctx.fillRect(tx - 1, ty + 4, CELL + 2, CELL + 2);

        ctx.save();
        ctx.beginPath();
        ctx.roundRect(tx, ty, CELL, CELL, 6);
        ctx.clip();
        ctx.drawImage(tileTexture, tx, ty, CELL, CELL);

        // Goal Tile Tints
        if (r === 0 && p1) {
          ctx.fillStyle = SKINS[p1.skin].base + "28";
          ctx.fillRect(tx, ty, CELL, CELL);
        }
        if (r === 8 && p2) {
          ctx.fillStyle = SKINS[p2.skin].base + "28";
          ctx.fillRect(tx, ty, CELL, CELL);
        }
        if (c === 8 && p3) {
          ctx.fillStyle = SKINS[p3.skin].base + "28";
          ctx.fillRect(tx, ty, CELL, CELL);
        }
        if (c === 0 && p4) {
          ctx.fillStyle = SKINS[p4.skin].base + "28";
          ctx.fillRect(tx, ty, CELL, CELL);
        }
        ctx.restore();

        ctx.strokeStyle = "rgba(148,163,184,0.22)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.roundRect(tx, ty, CELL, CELL, 6);
        ctx.stroke();

        if (validMoves.some(m => m.x === c && m.y === r)) {
          ctx.beginPath();
          ctx.arc(tx + CELL / 2, ty + CELL / 2, 11, 0, Math.PI * 2);
          ctx.fillStyle = "rgba(34, 197, 94, 0.35)";
          ctx.fill();
          ctx.lineWidth = 2.5;
          ctx.strokeStyle = "#4ade80";
          ctx.stroke();
        }
      }
    }

    // Groove Intersection Dots in Wall Mode
    if (mode === "WALL") {
      ctx.fillStyle = "rgba(245, 158, 11, 0.35)";
      for (let gy = 0; gy < 8; gy++) {
        for (let gx = 0; gx < 8; gx++) {
          ctx.beginPath();
          ctx.arc(PAD + gx * STEP + CELL + GAP / 2, PAD + gy * STEP + CELL + GAP / 2, 3, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    // Depth-Sorted Render Queue
    const items = [];
    state.walls.forEach(w => {
      items.push({ type: "wall", w, ghost: false, ok: true, y: w.dir === "H" ? w.gy + 0.85 : w.gy + 1.5 });
    });

    if (mode === "WALL" && previewWall) {
      const check = validateWall(previewWall.gx, previewWall.gy, previewWall.dir);
      items.push({
        type: "wall",
        w: previewWall,
        ghost: true,
        ok: check.ok,
        y: previewWall.dir === "H" ? previewWall.gy + 0.85 : previewWall.gy + 1.5
      });
    }

    state.players.forEach(p => {
      const a = anim[p.role] || { rx: p.x, ry: p.y, hop: 0, roll: 0 };
      items.push({
        type: "ball",
        p,
        rx: a.rx,
        ry: a.ry,
        hop: a.hop,
        roll: a.roll,
        active: activeP && activeP.role === p.role && !state.winnerRole,
        y: a.ry + 0.5
      });
    });

    items.sort((a, b) => a.y - b.y);

    for (const it of items) {
      if (it.type === "wall") draw3DWall(it.w.gx, it.w.gy, it.w.dir, it.ghost, it.ok);
      else draw3DBall(it.p, it.rx, it.ry, it.hop, it.roll, it.active);
    }
  }

  function draw3DWall(gx, gy, dir, isGhost, isOk) {
    ctx.save();
    const x = dir === "H" ? PAD + gx * STEP : PAD + gx * STEP + CELL;
    const y = dir === "H" ? PAD + gy * STEP + CELL : PAD + gy * STEP;
    const w = dir === "H" ? CELL * 2 + GAP : GAP;
    const h = dir === "H" ? GAP : CELL * 2 + GAP;
    const ext = WALL_H_3D;

    if (isGhost) ctx.globalAlpha = 0.82;

    ctx.fillStyle = "rgba(0,0,0,0.45)";
    ctx.beginPath();
    ctx.moveTo(x, y + h);
    ctx.lineTo(x + w, y + h);
    ctx.lineTo(x + w + 8, y + h + 7);
    ctx.lineTo(x + 8, y + h + 7);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = isGhost ? (isOk ? "#16a34a" : "#dc2626") : "#78350f";
    ctx.fillRect(x, y + h - ext, w, ext);

    const topY = y - ext;
    ctx.save();
    ctx.beginPath();
    ctx.rect(x, topY, w, h);
    ctx.clip();
    if (isGhost) {
      ctx.fillStyle = isOk ? "#4ade80" : "#f87171";
      ctx.fillRect(x, topY, w, h);
    } else {
      ctx.drawImage(woodTexture, x, topY, w, h);
      ctx.fillStyle = "#f59e0b";
      if (dir === "H") {
        ctx.fillRect(x, topY, 5, h);
        ctx.fillRect(x + w - 5, topY, 5, h);
      } else {
        ctx.fillRect(x, topY, w, 5);
        ctx.fillRect(x, topY + h - 5, w, 5);
      }
    }
    ctx.restore();

    ctx.strokeStyle = isGhost ? "#ffffff" : "#fbbf24";
    ctx.lineWidth = 1.2;
    ctx.strokeRect(x, topY, w, h);
    ctx.restore();
  }

  function draw3DBall(p, gx, gy, hop, roll, isTurn) {
    const sk = SKINS[p.skin] || SKINS[0];
    const tex = ballTextures[p.skin] || ballTextures[0];
    const cx = PAD + gx * STEP + CELL / 2;
    const baseCy = PAD + gy * STEP + CELL / 2;
    const cy = baseCy - 5 - hop * 15;
    const r = 17;

    ctx.save();
    if (isTurn) {
      ctx.beginPath();
      ctx.arc(cx, baseCy, r + 5, 0, Math.PI * 2);
      ctx.strokeStyle = "#facc15";
      ctx.lineWidth = 2.5;
      ctx.stroke();
    }

    // Floor Shadow
    ctx.beginPath();
    ctx.ellipse(cx + 3, baseCy + 5, r * 0.9, r * 0.55, 0, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(0,0,0,0.55)";
    ctx.fill();

    // 3D Sphere Clip + Texture
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.clip();

    const off = Math.floor(roll) % 64;
    ctx.drawImage(tex, off, off, 64, 64, cx - r, cy - r, r * 2, r * 2);

    // 3D Lighting
    const shade = ctx.createRadialGradient(cx - r * 0.35, cy - r * 0.35, r * 0.1, cx, cy, r);
    shade.addColorStop(0, "rgba(255,255,255,0.45)");
    shade.addColorStop(0.5, "rgba(0,0,0,0)");
    shade.addColorStop(1, "rgba(0,0,0,0.82)");
    ctx.fillStyle = shade;
    ctx.fillRect(cx - r, cy - r, r * 2, r * 2);

    // Specular Highlight
    ctx.beginPath();
    ctx.ellipse(cx - r * 0.33, cy - r * 0.35, r * 0.26, r * 0.15, -Math.PI / 4, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255,255,255,0.8)";
    ctx.fill();

    ctx.strokeStyle = sk.hi;
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.arc(cx, cy, r - 0.7, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();

    // Crisp P1/P2/P3/P4 Tag on Ball
    ctx.font = "bold 10px sans-serif";
    ctx.textAlign = "center";
    ctx.fillStyle = "#ffffff";
    ctx.shadowColor = "rgba(0,0,0,0.9)";
    ctx.shadowBlur = 4;
    ctx.fillText(p.name, cx, cy + 4);
    ctx.shadowBlur = 0;
  }
})();
</script>
</body>
</html>
