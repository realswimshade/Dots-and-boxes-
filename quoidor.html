<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Quoridor 3D</title>
  <script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.3/dist/mqtt.min.js"
          onerror="var s=document.createElement('script');s.src='https://unpkg.com/mqtt/dist/mqtt.min.js';document.head.appendChild(s);"></script>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --border: #334155;
      --accent: #f59e0b;
      --blue: #38bdf8;
      --red: #f43f5e;
      --green: #22c55e;
      --text: #f8fafc;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: none;
    }

    /* LOBBY / MENU SCREENS */
    .screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 20;
    }
    .hidden { display: none !important; }

    .card {
      background: rgba(30, 41, 59, 0.96);
      border: 2px solid var(--border);
      border-radius: 18px;
      padding: 22px;
      width: 100%;
      max-width: 390px;
      box-shadow: 0 20px 45px rgba(0,0,0,0.6);
      text-align: center;
    }
    h1 {
      font-size: 1.7rem;
      font-weight: 900;
      color: var(--accent);
      margin-bottom: 4px;
    }
    .sub {
      font-size: 0.82rem;
      color: #94a3b8;
      margin-bottom: 16px;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 2px solid #475569;
      background: #0f172a;
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 12px;
      outline: none;
    }
    input:focus { border-color: var(--accent); }

    .divider {
      display: flex;
      align-items: center;
      margin: 14px 0;
      color: #64748b;
      font-size: 0.75rem;
      font-weight: 800;
    }
    .divider::before, .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #334155;
      margin: 0 10px;
    }

    .join-row {
      display: flex;
      gap: 8px;
    }
    .join-row input {
      margin-bottom: 0;
      flex: 1.2;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .btn {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: none;
      font-weight: 800;
      font-size: 0.95rem;
      cursor: pointer;
      background: var(--accent);
      color: #0f172a;
      transition: transform 0.1s;
    }
    .btn:active { transform: scale(0.96); }
    .btn-sec { background: #334155; color: #f8fafc; }
    .btn-green { background: var(--green); color: #052e16; }
    .btn-blue { background: var(--blue); color: #082f49; }

    .code-box {
      background: #0f172a;
      border: 2px dashed var(--accent);
      border-radius: 12px;
      padding: 14px;
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: 6px;
      color: var(--accent);
      margin: 12px 0;
      cursor: pointer;
    }

    /* GAME SCREEN */
    #gameScreen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px 12px;
    }

    .top-hud {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .meta-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.76rem;
      color: #94a3b8;
      padding: 0 4px;
    }
    .badge {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid #334155;
      padding: 3px 10px;
      border-radius: 99px;
      font-weight: 700;
      color: #e2e8f0;
    }

    .score-strip {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 6px;
      align-items: center;
      background: rgba(30, 41, 59, 0.92);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 8px 10px;
    }
    .p-card {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 4px 8px;
      border-radius: 10px;
      border: 2px solid transparent;
    }
    .p-card.active {
      border-color: var(--accent);
      background: rgba(245, 158, 11, 0.14);
    }
    .p-title {
      font-weight: 900;
      font-size: 0.88rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .p-sub {
      font-size: 0.76rem;
      color: #cbd5e1;
      font-weight: 700;
    }
    .turn-pill {
      font-weight: 900;
      font-size: 0.78rem;
      color: var(--accent);
      padding: 0 6px;
      text-align: center;
    }

    #canvasContainer {
      position: relative;
      flex: 1;
      width: 100%;
      max-width: 500px;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      max-width: 100%;
      max-height: 100%;
      border-radius: 16px;
      box-shadow: 0 16px 38px rgba(0,0,0,0.75);
      touch-action: none;
    }

    #toast {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.95);
      border: 2px solid var(--accent);
      color: #fff;
      padding: 7px 14px;
      border-radius: 99px;
      font-size: 0.82rem;
      font-weight: 800;
      white-space: nowrap;
      pointer-events: none;
      z-index: 15;
    }

    /* SIMPLIFIED BOTTOM CONTROLS */
    .controls-wrap {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .toggle-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .mode-tab {
      padding: 12px;
      border-radius: 12px;
      border: 2px solid #334155;
      background: #1e293b;
      color: #94a3b8;
      font-weight: 900;
      font-size: 0.92rem;
      cursor: pointer;
    }
    .mode-tab.active {
      border-color: var(--accent);
      background: var(--accent);
      color: #0f172a;
    }
    .wall-actions {
      display: grid;
      grid-template-columns: 1fr 1.6fr;
      gap: 8px;
    }
  </style>
</head>
<body>

  <!-- 1. CLASSIC ROOM CREATE / JOIN SCREEN -->
  <div id="menuScreen" class="screen">
    <div class="card">
      <h1>🏛️ QUORIDOR 3D</h1>
      <div class="sub">3D Textured Spheres & Walls • Syria Direct Mesh</div>

      <input id="nameInput" type="text" maxlength="12" placeholder="Your Nickname" />

      <button class="btn" id="createRoomBtn">➕ CREATE NEW ROOM</button>

      <div class="divider">OR JOIN WITH CODE</div>

      <div class="join-row">
        <input id="codeInput" type="text" maxlength="4" placeholder="CODE" />
        <button class="btn btn-blue" id="joinRoomBtn" style="flex:0.8;">JOIN ➡️</button>
      </div>
    </div>
  </div>

  <!-- 2. WAITING ROOM LOBBY -->
  <div id="lobbyScreen" class="screen hidden">
    <div class="card">
      <h1>ROOM CREATED</h1>
      <div class="sub">Tap the code to copy & send to your friend</div>

      <div class="code-box" id="lobbyCodeDisplay">----</div>

      <div id="lobbyWaitText" style="font-size:0.9rem; font-weight:700; color:#cbd5e1; margin: 12px 0;">
        ⏳ Waiting for opponent to join (1/2)...
      </div>

      <button class="btn btn-sec" id="cancelLobbyBtn">CANCEL</button>
    </div>
  </div>

  <!-- 3. GAMEPLAY SCREEN -->
  <div id="gameScreen" class="hidden">
    <div class="top-hud">
      <div class="meta-bar">
        <span class="badge" id="roomTag">ROOM: ----</span>
        <span class="badge" id="meshTag">🟢 Connecting...</span>
        <button id="leaveGameBtn" style="background:#334155;color:#fff;border:none;border-radius:8px;padding:3px 10px;font-weight:800;font-size:0.74rem;cursor:pointer;">LEAVE</button>
      </div>

      <div class="score-strip">
        <div class="p-card" id="p1Card">
          <div class="p-title" id="p1Title" style="color:#38bdf8;">🔵 Player 1</div>
          <div class="p-sub" id="p1Sub">🧱 10  •  🏆 0</div>
        </div>
        <div class="turn-pill" id="turnText">YOUR TURN</div>
        <div class="p-card" id="p2Card" style="text-align:right;">
          <div class="p-title" id="p2Title" style="color:#fb7185;">🔴 Player 2</div>
          <div class="p-sub" id="p2Sub">🧱 10  •  🏆 0</div>
        </div>
      </div>
    </div>

    <div id="canvasContainer">
      <div id="toast" class="hidden"></div>
      <canvas id="boardCanvas" width="540" height="560"></canvas>
    </div>

    <div class="controls-wrap">
      <div class="wall-actions hidden" id="wallActionRow">
        <button class="btn btn-sec" id="rotateBtn">🔄 ROTATE (H/V)</button>
        <button class="btn btn-green" id="placeWallBtn">✅ PLACE WALL</button>
      </div>
      <div class="toggle-row">
        <button class="mode-tab active" id="tabMove">🏃 MOVE PAWN</button>
        <button class="mode-tab" id="tabWall">🧱 WALL MODE</button>
      </div>
    </div>
  </div>

<script>
(() => {
  /* =========================================================
     1. SYRIA ZERO-VPN MULTI-BROKER MESH
  ========================================================= */
  const BROKERS = [
    { name: "Eclipse-443", url: "wss://mqtt.eclipseprojects.io:443/mqtt" },
    { name: "HiveMQ-EU",   url: "wss://broker.hivemq.com:8884/mqtt" },
    { name: "Mosquitto-EU",url: "wss://test.mosquitto.org:8081/mqtt" },
    { name: "EMQX",        url: "wss://broker.emqx.io:8084/mqtt" }
  ];

  /* =========================================================
     2. PROCEDURAL 3D TEXTURES (BALLS, WOOD WALLS, STONE TILES)
  ========================================================= */
  const BALL_STYLES = [
    { base: "#0284c7", hi: "#bae6fd", dark: "#082f49", vein: "#ffffff" }, // P1 Sapphire Marble
    { base: "#e11d48", hi: "#fecdd3", dark: "#4c0519", vein: "#facc15" }  // P2 Crimson Gold Marble
  ];
  const ballTextures = [];
  let woodTexture = null;
  let tileTexture = null;

  function generate3DAssets() {
    // 1. 3D Marble Sphere Textures
    BALL_STYLES.forEach((st, idx) => {
      const c = document.createElement("canvas");
      c.width = 128; c.height = 128;
      const g = c.getContext("2d");
      g.fillStyle = st.base;
      g.fillRect(0, 0, 128, 128);

      for (let i = 0; i < 26; i++) {
        g.beginPath();
        g.strokeStyle = i % 2 === 0 ? st.vein : st.dark;
        g.globalAlpha = 0.28;
        g.lineWidth = 2.4;
        let x = (i * 17) % 128;
        g.moveTo(x, 0);
        for (let y = 16; y <= 128; y += 16) {
          g.lineTo(x + Math.sin((y + i * 22) * 0.08) * 16, y);
        }
        g.stroke();
      }
      ballTextures[idx] = c;
    });

    // 2. 3D Mahogany Wood Plank Texture
    const wc = document.createElement("canvas");
    wc.width = 128; wc.height = 64;
    const wg = wc.getContext("2d");
    const grad = wg.createLinearGradient(0, 0, 0, 64);
    grad.addColorStop(0, "#d97706");
    grad.addColorStop(0.5, "#b45309");
    grad.addColorStop(1, "#78350f");
    wg.fillStyle = grad;
    wg.fillRect(0, 0, 128, 64);
    wg.strokeStyle = "rgba(45, 18, 4, 0.35)";
    wg.lineWidth = 1.5;
    for (let i = 0; i < 16; i++) {
      wg.beginPath();
      const y = (i * 4) % 64;
      wg.moveTo(0, y);
      wg.bezierCurveTo(40, y + 3, 85, y - 3, 128, y);
      wg.stroke();
    }
    woodTexture = wc;

    // 3. Carved Basalt Tile Texture
    const tc = document.createElement("canvas");
    tc.width = 64; tc.height = 64;
    const tg = tc.getContext("2d");
    const tGrad = tg.createLinearGradient(0, 0, 64, 64);
    tGrad.addColorStop(0, "#27354f");
    tGrad.addColorStop(1, "#1b2538");
    tg.fillStyle = tGrad;
    tg.fillRect(0, 0, 64, 64);
    tileTexture = tc;
  }
  generate3DAssets();

  /* =========================================================
     3. SOUND ENGINE
  ========================================================= */
  let audioCtx = null;
  function playSfx(type) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === "move") {
        osc.type = "sine";
        osc.frequency.setValueAtTime(260, now);
        osc.frequency.exponentialRampToValueAtTime(520, now + 0.1);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.11);
        osc.start(now); osc.stop(now + 0.11);
      } else if (type === "wall") {
        osc.type = "triangle";
        osc.frequency.setValueAtTime(160, now);
        osc.frequency.exponentialRampToValueAtTime(70, now + 0.15);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.16);
        osc.start(now); osc.stop(now + 0.16);
      } else if (type === "snap") {
        osc.type = "sine";
        osc.frequency.setValueAtTime(600, now);
        gain.gain.setValueAtTime(0.06, now);
        gain.gain.linearRampToValueAtTime(0.005, now + 0.04);
        osc.start(now); osc.stop(now + 0.04);
      } else if (type === "err") {
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(130, now);
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.14);
        osc.start(now); osc.stop(now + 0.14);
      } else if (type === "win") {
        osc.type = "triangle";
        osc.frequency.setValueAtTime(330, now);
        osc.frequency.setValueAtTime(490, now + 0.12);
        osc.frequency.setValueAtTime(660, now + 0.25);
        gain.gain.setValueAtTime(0.28, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.48);
        osc.start(now); osc.stop(now + 0.48);
      }
    } catch (_) {}
  }

  /* =========================================================
     4. BOARD GEOMETRY & STATE
  ========================================================= */
  const canvas = document.getElementById("boardCanvas");
  const ctx = canvas.getContext("2d");

  const GRID = 9;
  const PAD_X = 34;
  const PAD_TOP = 44;
  const CELL = 44;
  const GAP = 10;
  const STEP = CELL + GAP; // 54px
  const WALL_H_3D = 14;

  const myId = "q_" + Math.random().toString(36).substring(2, 8);
  let myName = "Shade";
  let roomCode = "";
  let myRole = 1; // 1 = Host (Blue), 2 = Guest (Red)

  let clients = [];
  let connectedBrokers = [];
  let seenPackets = new Set();

  let state = {
    seq: 0,
    turn: 1,
    winner: 0,
    p1: { x: 4, y: 8, walls: 10, name: "Player 1", id: null, score: 0 },
    p2: { x: 4, y: 0, walls: 10, name: "Player 2", id: null, score: 0 },
    walls: [] // { gx: 0..7, gy: 0..7, dir: 'H' | 'V' }
  };

  let anim = {
    p1: { rx: 4, ry: 8, hop: 0, roll: 0 },
    p2: { rx: 4, ry: 0, hop: 0, roll: 0 }
  };

  let mode = "MOVE"; // "MOVE" | "WALL"
  let previewWall = null; // { gx, gy, dir }

  const nameInput = document.getElementById("nameInput");
  const codeInput = document.getElementById("codeInput");

  if (window.Telegram?.WebApp?.initDataUnsafe?.user?.first_name) {
    nameInput.value = window.Telegram.WebApp.initDataUnsafe.user.first_name.slice(0, 12);
    window.Telegram.WebApp.expand();
  }

  /* =========================================================
     5. ROOM CREATION & JOIN FLOW
  ========================================================= */
  function randomCode() {
    const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    let out = "";
    for (let i = 0; i < 4; i++) out += chars[Math.floor(Math.random() * chars.length)];
    return out;
  }

  document.getElementById("createRoomBtn").onclick = () => {
    myName = (nameInput.value.trim() || "Player 1").slice(0, 12);
    roomCode = randomCode();
    myRole = 1;

    state.p1 = { x: 4, y: 8, walls: 10, name: myName, id: myId, score: 0 };
    state.p2 = { x: 4, y: 0, walls: 10, name: "Waiting...", id: null, score: 0 };
    resetBoard(false);

    document.getElementById("menuScreen").classList.add("hidden");
    document.getElementById("lobbyScreen").classList.remove("hidden");
    document.getElementById("lobbyCodeDisplay").textContent = roomCode;
    document.getElementById("lobbyWaitText").textContent = "⏳ Waiting for opponent to join (1/2)...";

    connectMesh();
  };

  document.getElementById("lobbyCodeDisplay").onclick = () => {
    navigator.clipboard?.writeText(roomCode);
    document.getElementById("lobbyWaitText").textContent = "✅ Room Code Copied! Waiting for friend...";
  };

  document.getElementById("cancelLobbyBtn").onclick = () => {
    closeMesh();
    document.getElementById("lobbyScreen").classList.add("hidden");
    document.getElementById("menuScreen").classList.remove("hidden");
  };

  document.getElementById("joinRoomBtn").onclick = () => {
    const code = codeInput.value.trim().toUpperCase();
    if (code.length < 2) {
      codeInput.focus();
      return;
    }
    myName = (nameInput.value.trim() || "Player 2").slice(0, 12);
    roomCode = code;
    myRole = 2;

    state.p1 = { x: 4, y: 8, walls: 10, name: "Host", id: null, score: 0 };
    state.p2 = { x: 4, y: 0, walls: 10, name: myName, id: myId, score: 0 };
    resetBoard(false);

    document.getElementById("menuScreen").classList.add("hidden");
    document.getElementById("gameScreen").classList.remove("hidden");
    document.getElementById("roomTag").textContent = `ROOM: ${roomCode}`;

    connectMesh();
  };

  document.getElementById("leaveGameBtn").onclick = () => {
    closeMesh();
    document.getElementById("gameScreen").classList.add("hidden");
    document.getElementById("menuScreen").classList.remove("hidden");
  };

  /* =========================================================
     6. MULTI-BROKER MESH NETWORKING
  ========================================================= */
  function closeMesh() {
    clients.forEach(c => { try { c.end(true); } catch (_) {} });
    clients = [];
    connectedBrokers = [];
  }

  function connectMesh() {
    closeMesh();
    seenPackets.clear();
    const topic = `quoridor_2b_${roomCode}`;

    BROKERS.forEach(b => {
      try {
        const c = mqtt.connect(b.url, {
          clientId: `${myId}_${b.name}_${Math.floor(Math.random() * 999)}`,
          keepalive: 25,
          clean: true,
          connectTimeout: 6000,
          reconnectPeriod: 2500
        });

        c.on("connect", () => {
          if (!connectedBrokers.includes(b.name)) {
            connectedBrokers.push(b.name);
            updateMeshIndicator();
          }
          c.subscribe(topic, { qos: 0 }, () => {
            sendPacket({ t: "join", role: myRole, id: myId, name: myName });
          });
        });

        c.on("close", () => {
          connectedBrokers = connectedBrokers.filter(n => n !== b.name);
          updateMeshIndicator();
        });

        c.on("message", (_, payload) => {
          try {
            handlePacket(JSON.parse(payload.toString()));
          } catch (_) {}
        });

        clients.push(c);
      } catch (_) {}
    });
  }

  function updateMeshIndicator() {
    const el = document.getElementById("meshTag");
    if (connectedBrokers.length === 0) {
      el.textContent = "🔴 Reconnecting...";
    } else {
      el.textContent = `🟢 Connected (${connectedBrokers[0]})`;
    }
  }

  function sendPacket(pkt) {
    pkt.uid = myId + "_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6);
    seenPackets.add(pkt.uid);
    const str = JSON.stringify(pkt);
    const topic = `quoridor_2b_${roomCode}`;
    clients.forEach(c => {
      if (c && c.connected) {
        try { c.publish(topic, str, { qos: 0 }); } catch (_) {}
      }
    });
  }

  function handlePacket(msg) {
    if (!msg || !msg.uid || seenPackets.has(msg.uid)) return;
    seenPackets.add(msg.uid);

    if (msg.t === "join") {
      if (msg.id === myId) return;

      if (myRole === 1) {
        state.p2.id = msg.id;
        state.p2.name = msg.name;
        // Move Host from Waiting Lobby into Game Screen automatically
        document.getElementById("lobbyScreen").classList.add("hidden");
        document.getElementById("gameScreen").classList.remove("hidden");
        document.getElementById("roomTag").textContent = `ROOM: ${roomCode}`;
        updateHud();
        showToast(`⚔️ ${msg.name} joined! Your turn.`);
        sendPacket({ t: "sync", state });
      } else if (myRole === 2 && msg.role === 1) {
        state.p1.id = msg.id;
        state.p1.name = msg.name;
        updateHud();
        sendPacket({ t: "join", role: 2, id: myId, name: myName });
      }
      return;
    }

    if (msg.t === "sync" || msg.t === "state") {
      const inc = msg.state;
      if (!inc) return;
      if (msg.t === "state" && inc.seq <= state.seq) return;

      const moved = inc.p1.x !== state.p1.x || inc.p1.y !== state.p1.y ||
                    inc.p2.x !== state.p2.x || inc.p2.y !== state.p2.y;
      const walled = inc.walls.length > state.walls.length;

      state = inc;
      if (moved) {
        anim.p1.hop = 1;
        anim.p2.hop = 1;
        playSfx("move");
      } else if (walled) {
        playSfx("wall");
      }

      if (state.winner) {
        playSfx("win");
        const wName = state.winner === 1 ? state.p1.name : state.p2.name;
        showToast(`🏆 ${wName} WINS!`);
      }
      updateHud();
    }
  }

  function resetBoard(keepScores) {
    const s1 = keepScores ? state.p1.score : 0;
    const s2 = keepScores ? state.p2.score : 0;
    state.seq = (state.seq || 0) + 1;
    state.turn = 1;
    state.winner = 0;
    state.p1.x = 4; state.p1.y = 8; state.p1.walls = 10; state.p1.score = s1;
    state.p2.x = 4; state.p2.y = 0; state.p2.walls = 10; state.p2.score = s2;
    state.walls = [];
    anim.p1.rx = 4; anim.p1.ry = 8;
    anim.p2.rx = 4; anim.p2.ry = 0;
    setMode("MOVE");
    updateHud();
  }

  /* =========================================================
     7. QUORIDOR RULES & BFS PATH VALIDATION
  ========================================================= */
  function isBlocked(x1, y1, x2, y2, wallList) {
    if (x2 < 0 || x2 >= GRID || y2 < 0 || y2 >= GRID) return true;
    if (x1 === x2 && Math.abs(y1 - y2) === 1) {
      const minY = Math.min(y1, y2);
      return wallList.some(w => w.dir === "H" && w.gy === minY && (w.gx === x1 || w.gx === x1 - 1));
    }
    if (y1 === y2 && Math.abs(x1 - x2) === 1) {
      const minX = Math.min(x1, x2);
      return wallList.some(w => w.dir === "V" && w.gx === minX && (w.gy === y1 || w.gy === y1 - 1));
    }
    return true;
  }

  function hasPathToGoal(startX, startY, goalRow, wallList) {
    const visited = new Uint8Array(81);
    const q = [{ x: startX, y: startY }];
    visited[startY * 9 + startX] = 1;
    let head = 0;
    const dirs = [[0, -1], [0, 1], [-1, 0], [1, 0]];

    while (head < q.length) {
      const cur = q[head++];
      if (cur.y === goalRow) return true;
      for (const [dx, dy] of dirs) {
        const nx = cur.x + dx, ny = cur.y + dy;
        if (nx >= 0 && nx < 9 && ny >= 0 && ny < 9) {
          const idx = ny * 9 + nx;
          if (!visited[idx] && !isBlocked(cur.x, cur.y, nx, ny, wallList)) {
            visited[idx] = 1;
            q.push({ x: nx, y: ny });
          }
        }
      }
    }
    return false;
  }

  function getValidMoves(pNum) {
    const me = pNum === 1 ? state.p1 : state.p2;
    const opp = pNum === 1 ? state.p2 : state.p1;
    const out = [];
    const dirs = [[0, -1], [0, 1], [-1, 0], [1, 0]];

    for (const [dx, dy] of dirs) {
      const nx = me.x + dx, ny = me.y + dy;
      if (isBlocked(me.x, me.y, nx, ny, state.walls)) continue;

      if (nx === opp.x && ny === opp.y) {
        const jx = opp.x + dx, jy = opp.y + dy;
        if (!isBlocked(opp.x, opp.y, jx, jy, state.walls)) {
          out.push({ x: jx, y: jy });
        } else {
          const sides = dx === 0 ? [[-1, 0], [1, 0]] : [[0, -1], [0, 1]];
          for (const [sdx, sdy] of sides) {
            const sx = opp.x + sdx, sy = opp.y + sdy;
            if (!isBlocked(opp.x, opp.y, sx, sy, state.walls)) out.push({ x: sx, y: sy });
          }
        }
      } else {
        out.push({ x: nx, y: ny });
      }
    }
    return out;
  }

  function validateWall(gx, gy, dir) {
    if (gx < 0 || gx > 7 || gy < 0 || gy > 7) return { ok: false, msg: "Out of bounds" };
    const me = state.turn === 1 ? state.p1 : state.p2;
    if (me.walls <= 0) return { ok: false, msg: "You have 0 walls left!" };

    for (const w of state.walls) {
      if (w.gx === gx && w.gy === gy) return { ok: false, msg: "Wall intersection blocked!" };
      if (dir === "H" && w.dir === "H" && w.gy === gy && Math.abs(w.gx - gx) <= 1) {
        return { ok: false, msg: "Overlaps existing wall!" };
      }
      if (dir === "V" && w.dir === "V" && w.gx === gx && Math.abs(w.gy - gy) <= 1) {
        return { ok: false, msg: "Overlaps existing wall!" };
      }
    }

    const nextWalls = [...state.walls, { gx, gy, dir }];
    if (!hasPathToGoal(state.p1.x, state.p1.y, 0, nextWalls) ||
        !hasPathToGoal(state.p2.x, state.p2.y, 8, nextWalls)) {
      return { ok: false, msg: "Cannot completely trap a player!" };
    }
    return { ok: true };
  }

  /* =========================================================
     8. SIMPLIFIED WALL & MOVE CONTROLS
  ========================================================= */
  function isMyTurn() {
    return !state.winner && state.p2.id && state.turn === myRole;
  }

  function setMode(newMode) {
    mode = newMode;
    document.getElementById("tabMove").classList.toggle("active", mode === "MOVE");
    document.getElementById("tabWall").classList.toggle("active", mode === "WALL");
    document.getElementById("wallActionRow").classList.toggle("hidden", mode !== "WALL");

    if (mode === "MOVE") {
      previewWall = null;
    } else if (!previewWall) {
      previewWall = { gx: 3, gy: 3, dir: "H" };
    }
  }

  document.getElementById("tabMove").onclick = () => setMode("MOVE");
  document.getElementById("tabWall").onclick = () => {
    const myWalls = myRole === 1 ? state.p1.walls : state.p2.walls;
    if (myWalls <= 0) {
      playSfx("err");
      showToast("⚠️ You have 0 walls remaining!");
      return;
    }
    setMode("WALL");
  };

  document.getElementById("rotateBtn").onclick = () => {
    if (!previewWall) return;
    previewWall.dir = previewWall.dir === "H" ? "V" : "H";
    playSfx("snap");
  };

  document.getElementById("placeWallBtn").onclick = () => {
    if (!previewWall) return;
    if (!isMyTurn()) {
      playSfx("err");
      showToast("⏳ Wait for your turn!");
      return;
    }
    const check = validateWall(previewWall.gx, previewWall.gy, previewWall.dir);
    if (!check.ok) {
      playSfx("err");
      showToast(`⚠️ ${check.msg}`);
      return;
    }

    const activeP = state.turn === 1 ? state.p1 : state.p2;
    activeP.walls -= 1;
    state.walls.push({ ...previewWall });
    state.turn = state.turn === 1 ? 2 : 1;
    state.seq += 1;

    playSfx("wall");
    setMode("MOVE");
    updateHud();
    sendPacket({ t: "state", state });
  };

  // Smart Pointer Handling: Drag or Tap to Snap Wall to Groove Automatically
  let isDraggingWall = false;

  function getCanvasPoint(e) {
    const r = canvas.getBoundingClientRect();
    return {
      cx: (e.clientX - r.left) * (canvas.width / r.width),
      cy: (e.clientY - r.top) * (canvas.height / r.height)
    };
  }

  function updateWallPreviewFromPoint(cx, cy, allowTapFlip) {
    // Calculate fractional grid position relative to intersections
    const rawX = (cx - PAD_X - CELL - GAP / 2) / STEP;
    const rawY = (cy - PAD_TOP - CELL - GAP / 2) / STEP;
    const gx = Math.max(0, Math.min(7, Math.round(rawX)));
    const gy = Math.max(0, Math.min(7, Math.round(rawY)));

    // Determine whether finger is in a horizontal groove or vertical groove
    const ix = PAD_X + gx * STEP + CELL + GAP / 2;
    const iy = PAD_TOP + gy * STEP + CELL + GAP / 2;
    const dx = Math.abs(cx - ix);
    const dy = Math.abs(cy - iy);

    // If user tapped directly on the already-selected intersection, flip H <-> V
    if (allowTapFlip && previewWall && previewWall.gx === gx && previewWall.gy === gy && dx < 22 && dy < 22) {
      previewWall.dir = previewWall.dir === "H" ? "V" : "H";
      playSfx("snap");
      return;
    }

    // Auto-detect orientation from which groove the finger is sliding along
    let autoDir = previewWall ? previewWall.dir : "H";
    if (dx > dy + 8) autoDir = "H";
    else if (dy > dx + 8) autoDir = "V";

    if (!previewWall || previewWall.gx !== gx || previewWall.gy !== gy || previewWall.dir !== autoDir) {
      previewWall = { gx, gy, dir: autoDir };
      playSfx("snap");
    }
  }

  canvas.addEventListener("pointerdown", e => {
    e.preventDefault();
    const { cx, cy } = getCanvasPoint(e);

    if (mode === "MOVE") {
      const col = Math.floor((cx - PAD_X) / STEP);
      const row = Math.floor((cy - PAD_TOP) / STEP);
      if (col >= 0 && col < 9 && row >= 0 && row < 9) {
        tryMovePawn(col, row);
      }
    } else {
      isDraggingWall = true;
      updateWallPreviewFromPoint(cx, cy, true);
    }
  });

  canvas.addEventListener("pointermove", e => {
    if (!isDraggingWall || mode !== "WALL") return;
    const { cx, cy } = getCanvasPoint(e);
    updateWallPreviewFromPoint(cx, cy, false);
  });

  window.addEventListener("pointerup", () => { isDraggingWall = false; });

  function tryMovePawn(col, row) {
    if (!isMyTurn()) {
      playSfx("err");
      showToast(state.p2.id ? "⏳ Opponent's turn!" : "⏳ Waiting for friend...");
      return;
    }
    const moves = getValidMoves(state.turn);
    if (!moves.some(m => m.x === col && m.y === row)) return;

    const p = state.turn === 1 ? state.p1 : state.p2;
    p.x = col; p.y = row;

    if (state.turn === 1) anim.p1.hop = 1;
    else anim.p2.hop = 1;

    if (state.turn === 1 && p.y === 0) {
      state.winner = 1;
      state.p1.score += 1;
      playSfx("win");
      showToast(`🏆 ${state.p1.name} WINS THE ROUND!`);
      setTimeout(() => { resetBoard(true); sendPacket({ t: "state", state }); }, 3000);
    } else if (state.turn === 2 && p.y === 8) {
      state.winner = 2;
      state.p2.score += 1;
      playSfx("win");
      showToast(`🏆 ${state.p2.name} WINS THE ROUND!`);
      setTimeout(() => { resetBoard(true); sendPacket({ t: "state", state }); }, 3000);
    } else {
      state.turn = state.turn === 1 ? 2 : 1;
      playSfx("move");
    }

    state.seq += 1;
    updateHud();
    sendPacket({ t: "state", state });
  }

  function updateHud() {
    document.getElementById("p1Title").textContent = `🔵 ${state.p1.name} ${myRole === 1 ? "(You)" : ""}`;
    document.getElementById("p2Title").textContent = `🔴 ${state.p2.name} ${myRole === 2 ? "(You)" : ""}`;
    document.getElementById("p1Sub").textContent = `🧱 ${state.p1.walls}  •  🏆 ${state.p1.score}`;
    document.getElementById("p2Sub").textContent = `🧱 ${state.p2.walls}  •  🏆 ${state.p2.score}`;

    document.getElementById("p1Card").classList.toggle("active", state.turn === 1);
    document.getElementById("p2Card").classList.toggle("active", state.turn === 2);

    const t = document.getElementById("turnText");
    if (state.winner) t.textContent = "🏆 ROUND OVER";
    else if (!state.p2.id) t.textContent = "WAITING...";
    else t.textContent = state.turn === myRole ? "⚡ YOUR TURN" : "⏳ OPPONENT";
  }

  let toastTimer = null;
  function showToast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.remove("hidden");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.add("hidden"), 2500);
  }

  /* =========================================================
     9. 3D TABLETOP RENDER LOOP
  ========================================================= */
  function loop() {
    anim.p1.rx += (state.p1.x - anim.p1.rx) * 0.25;
    anim.p1.ry += (state.p1.y - anim.p1.ry) * 0.25;
    anim.p1.hop *= 0.84;
    anim.p1.roll += Math.hypot(state.p1.x - anim.p1.rx, state.p1.y - anim.p1.ry) * 14;

    anim.p2.rx += (state.p2.x - anim.p2.rx) * 0.25;
    anim.p2.ry += (state.p2.y - anim.p2.ry) * 0.25;
    anim.p2.hop *= 0.84;
    anim.p2.roll += Math.hypot(state.p2.x - anim.p2.rx, state.p2.y - anim.p2.ry) * 14;

    drawScene();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  function drawScene() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 3D Outer Board Base
    ctx.fillStyle = "#090d16";
    ctx.beginPath();
    ctx.roundRect(14, 18, canvas.width - 28, canvas.height - 26, 18);
    ctx.fill();

    ctx.fillStyle = "#1e293b";
    ctx.beginPath();
    ctx.roundRect(14, 10, canvas.width - 28, canvas.height - 28, 18);
    ctx.fill();
    ctx.strokeStyle = "#475569";
    ctx.lineWidth = 2;
    ctx.stroke();

    // Goal Labels
    ctx.font = "bold 11px sans-serif";
    ctx.textAlign = "center";
    ctx.fillStyle = "#38bdf8";
    ctx.fillText(`▲ ${state.p1.name.toUpperCase()} GOAL ▲`, canvas.width / 2, 30);
    ctx.fillStyle = "#fb7185";
    ctx.fillText(`▼ ${state.p2.name.toUpperCase()} GOAL ▼`, canvas.width / 2, canvas.height - 22);

    const validMoves = isMyTurn() && mode === "MOVE" ? getValidMoves(state.turn) : [];

    // Draw 9x9 Carved 3D Tiles
    for (let r = 0; r < GRID; r++) {
      for (let c = 0; c < GRID; c++) {
        const tx = PAD_X + c * STEP;
        const ty = PAD_TOP + r * STEP;

        ctx.fillStyle = "#0b0f19";
        ctx.fillRect(tx - 1, ty + 4, CELL + 2, CELL + 2);

        ctx.save();
        ctx.beginPath();
        ctx.roundRect(tx, ty, CELL, CELL, 6);
        ctx.clip();
        ctx.drawImage(tileTexture, tx, ty, CELL, CELL);
        if (r === 0) {
          ctx.fillStyle = "rgba(56, 189, 248, 0.16)";
          ctx.fillRect(tx, ty, CELL, CELL);
        } else if (r === 8) {
          ctx.fillStyle = "rgba(251, 113, 133, 0.16)";
          ctx.fillRect(tx, ty, CELL, CELL);
        }
        ctx.restore();

        ctx.strokeStyle = r === 0 ? "#38bdf8" : (r === 8 ? "#fb7185" : "rgba(148,163,184,0.2)");
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.roundRect(tx, ty, CELL, CELL, 6);
        ctx.stroke();

        if (validMoves.some(m => m.x === c && m.y === r)) {
          ctx.beginPath();
          ctx.arc(tx + CELL / 2, ty + CELL / 2, 11, 0, Math.PI * 2);
          ctx.fillStyle = "rgba(34, 197, 94, 0.35)";
          ctx.fill();
          ctx.lineWidth = 2.5;
          ctx.strokeStyle = "#4ade80";
          ctx.stroke();
        }
      }
    }

    // Subtle Guide Dots in Grooves when in Wall Mode
    if (mode === "WALL") {
      ctx.fillStyle = "rgba(245, 158, 11, 0.35)";
      for (let gy = 0; gy < 8; gy++) {
        for (let gx = 0; gx < 8; gx++) {
          const ix = PAD_X + gx * STEP + CELL + GAP / 2;
          const iy = PAD_TOP + gy * STEP + CELL + GAP / 2;
          ctx.beginPath();
          ctx.arc(ix, iy, 3, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    // Depth-Sorted 3D Render Queue
    const items = [];
    state.walls.forEach(w => {
      items.push({ type: "wall", w, ghost: false, ok: true, y: w.dir === "H" ? w.gy + 0.85 : w.gy + 1.5 });
    });

    if (mode === "WALL" && previewWall) {
      const check = validateWall(previewWall.gx, previewWall.gy, previewWall.dir);
      items.push({
        type: "wall",
        w: previewWall,
        ghost: true,
        ok: check.ok,
        y: previewWall.dir === "H" ? previewWall.gy + 0.85 : previewWall.gy + 1.5
      });
    }

    items.push({
      type: "ball", rx: anim.p1.rx, ry: anim.p1.ry, hop: anim.p1.hop, roll: anim.p1.roll,
      styleIdx: 0, active: state.turn === 1 && !state.winner, y: anim.p1.ry + 0.5
    });
    items.push({
      type: "ball", rx: anim.p2.rx, ry: anim.p2.ry, hop: anim.p2.hop, roll: anim.p2.roll,
      styleIdx: 1, active: state.turn === 2 && !state.winner, y: anim.p2.ry + 0.5
    });

    items.sort((a, b) => a.y - b.y);

    for (const it of items) {
      if (it.type === "wall") draw3DWall(it.w.gx, it.w.gy, it.w.dir, it.ghost, it.ok);
      else draw3DBall(it.rx, it.ry, it.hop, it.roll, it.styleIdx, it.active);
    }
  }

  function draw3DWall(gx, gy, dir, isGhost, isOk) {
    ctx.save();
    const x = dir === "H" ? PAD_X + gx * STEP : PAD_X + gx * STEP + CELL;
    const y = dir === "H" ? PAD_TOP + gy * STEP + CELL : PAD_TOP + gy * STEP;
    const w = dir === "H" ? CELL * 2 + GAP : GAP;
    const h = dir === "H" ? GAP : CELL * 2 + GAP;
    const ext = WALL_H_3D;

    if (isGhost) ctx.globalAlpha = 0.82;

    // Drop Shadow
    ctx.fillStyle = "rgba(0,0,0,0.45)";
    ctx.beginPath();
    ctx.moveTo(x, y + h);
    ctx.lineTo(x + w, y + h);
    ctx.lineTo(x + w + 8, y + h + 7);
    ctx.lineTo(x + 8, y + h + 7);
    ctx.closePath();
    ctx.fill();

    // Front Extruded Face
    ctx.fillStyle = isGhost ? (isOk ? "#16a34a" : "#dc2626") : "#78350f";
    ctx.fillRect(x, y + h - ext, w, ext);

    // Top Plank Face
    const topY = y - ext;
    ctx.save();
    ctx.beginPath();
    ctx.rect(x, topY, w, h);
    ctx.clip();
    if (isGhost) {
      ctx.fillStyle = isOk ? "#4ade80" : "#f87171";
      ctx.fillRect(x, topY, w, h);
    } else {
      ctx.drawImage(woodTexture, x, topY, w, h);
      ctx.fillStyle = "#f59e0b";
      if (dir === "H") {
        ctx.fillRect(x, topY, 5, h);
        ctx.fillRect(x + w - 5, topY, 5, h);
      } else {
        ctx.fillRect(x, topY, w, 5);
        ctx.fillRect(x, topY + h - 5, w, 5);
      }
    }
    ctx.restore();

    ctx.strokeStyle = isGhost ? "#ffffff" : "#fbbf24";
    ctx.lineWidth = 1.2;
    ctx.strokeRect(x, topY, w, h);
    ctx.restore();
  }

  function draw3DBall(gx, gy, hop, roll, styleIdx, isTurn) {
    const st = BALL_STYLES[styleIdx];
    const tex = ballTextures[styleIdx];
    const cx = PAD_X + gx * STEP + CELL / 2;
    const baseCy = PAD_TOP + gy * STEP + CELL / 2;
    const cy = baseCy - 5 - hop * 15;
    const r = 17;

    ctx.save();
    if (isTurn) {
      ctx.beginPath();
      ctx.arc(cx, baseCy, r + 5, 0, Math.PI * 2);
      ctx.strokeStyle = "#facc15";
      ctx.lineWidth = 2.5;
      ctx.stroke();
    }

    // Floor Shadow
    ctx.beginPath();
    ctx.ellipse(cx + 3, baseCy + 5, r * 0.9, r * 0.55, 0, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(0,0,0,0.55)";
    ctx.fill();

    // Sphere Clip + Rolling Texture
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.clip();

    const off = Math.floor(roll) % 64;
    ctx.drawImage(tex, off, off, 64, 64, cx - r, cy - r, r * 2, r * 2);

    // 3D Lighting Overlay
    const shade = ctx.createRadialGradient(cx - r * 0.35, cy - r * 0.35, r * 0.1, cx, cy, r);
    shade.addColorStop(0, "rgba(255,255,255,0.45)");
    shade.addColorStop(0.5, "rgba(0,0,0,0)");
    shade.addColorStop(1, "rgba(0,0,0,0.8)");
    ctx.fillStyle = shade;
    ctx.fillRect(cx - r, cy - r, r * 2, r * 2);

    // Specular Glint
    ctx.beginPath();
    ctx.ellipse(cx - r * 0.33, cy - r * 0.35, r * 0.26, r * 0.15, -Math.PI / 4, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255,255,255,0.8)";
    ctx.fill();

    ctx.strokeStyle = st.hi;
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.arc(cx, cy, r - 0.7, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }
})();
</script>
</body>
