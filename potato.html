<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>💣 Potato Panic</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.3/dist/mqtt.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #0f172a; color: #f8fafc;
    font-family: system-ui, -apple-system, sans-serif;
    touch-action: none;
  }
  .hidden { display: none !important; }

  .overlay {
    position: fixed; inset: 0; display: flex; align-items: center;
    justify-content: center; padding: 14px; background: #0f172a; z-index: 10;
  }
  .card {
    background: #1e293b; border: 1px solid #334155; border-radius: 18px;
    padding: 20px; width: min(94vw, 380px); display: flex;
    flex-direction: column; gap: 12px; text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  h1 { font-size: 26px; font-weight: 900; color: #facc15; }
  .sub { font-size: 13px; color: #94a3b8; }
  .divider { height: 1px; background: #334155; margin: 2px 0; }
  input {
    width: 100%; padding: 12px; border-radius: 10px;
    border: 1px solid #475569; background: #0f172a; color: #f8fafc;
    font-size: 16px; font-weight: 700; text-align: center; outline: none;
  }
  input:focus { border-color: #facc15; }
  button {
    width: 100%; padding: 13px; border-radius: 12px; border: none;
    font-size: 16px; font-weight: 800; cursor: pointer;
    transition: transform 0.08s, opacity 0.15s;
  }
  button:active { transform: translateY(2px); }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-primary { background: #facc15; color: #0f172a; box-shadow: 0 4px 0 #b45309; }
  .btn-accent { background: #38bdf8; color: #0f172a; box-shadow: 0 4px 0 #0284c7; }
  .btn-secondary { background: #334155; color: #f8fafc; box-shadow: 0 4px 0 #0f172a; }
  .join-row { display: flex; gap: 8px; }
  .join-row input { flex: 1; text-transform: uppercase; letter-spacing: 3px; }
  .join-row button { width: auto; padding: 0 22px; }

  .code-box {
    background: #0f172a; border: 2px dashed #facc15; border-radius: 12px;
    padding: 10px; display: flex; flex-direction: column; gap: 4px;
  }
  .code-box span { font-size: 11px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }
  .code-box strong { font-size: 28px; color: #facc15; letter-spacing: 5px; }
  .status-pill { font-size: 12px; font-weight: 700; color: #facc15; }

  .player-list { display: flex; flex-direction: column; gap: 6px; max-height: 200px; overflow-y: auto; }
  .player-item {
    background: #0f172a; border: 1px solid #334155; border-radius: 10px;
    padding: 8px 12px; display: flex; justify-content: space-between;
    align-items: center; font-weight: 700; font-size: 14px;
  }

  #gameCanvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 1; }
  #hudTop {
    position: fixed; top: 10px; left: 10px; right: 10px;
    display: flex; justify-content: space-between; align-items: flex-start;
    pointer-events: none; z-index: 5; gap: 8px;
  }
  .hud-box {
    background: rgba(15, 23, 42, 0.88); border: 1px solid #334155;
    border-radius: 10px; padding: 6px 12px; font-size: 13px; font-weight: 700;
  }
  #banner {
    position: fixed; top: 58px; left: 50%; transform: translateX(-50%);
    background: rgba(15, 23, 42, 0.92); border: 1px solid #475569;
    padding: 6px 16px; border-radius: 999px; font-size: 14px; font-weight: 800;
    z-index: 5; pointer-events: none; white-space: nowrap;
  }
</style>
</head>
<body>

<!-- 1. MENU SCREEN -->
<div id="menuScreen" class="overlay">
  <div class="card">
    <h1>💣 Potato Panic</h1>
    <p class="sub">Pass the bomb before the timer hits zero! (2–7 Players)</p>
    <input id="nameInput" placeholder="Your Name" maxlength="12">
    <div class="divider"></div>
    <button id="createBtn" class="btn-primary">➕ Create New Room</button>
    <div class="sub" style="font-weight:700">OR JOIN WITH CODE</div>
    <div class="join-row">
      <input id="codeInput" placeholder="CODE" maxlength="4">
      <button id="joinBtn" class="btn-accent">Join</button>
    </div>
  </div>
</div>

<!-- 2. LOBBY SCREEN -->
<div id="lobbyScreen" class="overlay hidden">
  <div class="card">
    <h1 id="lobbyTitle">💣 Room Lobby</h1>
    <div class="code-box">
      <span>Room Code</span>
      <strong id="lobbyCode">----</strong>
    </div>
    <button id="copyBtn" class="btn-secondary" style="padding:8px;font-size:13px">📋 Copy Room Code</button>
    <div id="connStatus" class="status-pill">🟡 Connecting to broker...</div>
    <div id="playerList" class="player-list"></div>
    <button id="startBtn" class="btn-primary" disabled>Waiting for players (2–7)...</button>
    <button class="btn-secondary" onclick="location.reload()">🚪 Leave Room</button>
  </div>
</div>

<!-- 3. GAME HUD & ARENA -->
<canvas id="gameCanvas"></canvas>
<div id="hudTop" class="hidden">
  <div class="hud-box" id="roundInfo">Round 1 · First to 3 🏆</div>
  <div class="hud-box" id="scoreInfo"></div>
</div>
<div id="banner" class="hidden">Get Ready!</div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const cleanStr = (s) => String(s || "").replace(/[&<>"']/g, "").trim().slice(0, 12);
const myId = "p_" + Math.random().toString(36).slice(2, 8);
let myName = cleanStr(tg?.initDataUnsafe?.user?.first_name) || "Player";

const BROKER = "wss://broker.emqx.io:8084/mqtt";
const MAX_PLAYERS = 7;
const WIN_ROUNDS = 3;
const ARENA_W = 800;
const ARENA_H = 500;
const PLAYER_R = 22;

const AVATARS = [
  { emoji: "🥔", color: "#facc15" },
  { emoji: "🐸", color: "#4ade80" },
  { emoji: "🦊", color: "#fb923c" },
  { emoji: "🐙", color: "#f472b6" },
  { emoji: "🤖", color: "#38bdf8" },
  { emoji: "👾", color: "#c084fc" },
  { emoji: "🦖", color: "#f87171" }
];

const $= (id) => document.getElementById(id);$('nameInput').value = myName;

let client = null;
let roomCode = "";
let topic = "";
let isHost = false;
let joinRetryTimer = null;
let hostLoopTimer = null;

let state = {
  phase: "lobby",
  round: 0,
  holderId: null,
  bombDuration: 10000,
  stateVersion: 0,
  championId: null,
  lastEventText: "",
  players: []
};

// Positions: id -> { x, y, tx, ty, vx, vy, lastUpdate }
const positions = new Map();
let myPos = { x: 400, y: 250, vx: 0, vy: 0 };
let lastSentTime = 0;
let wasMoving = false;
let bombTimerStart = 0;
let lastTagTime = 0;

const keys = {};
const joy = { active: false, ox: 0, oy: 0, x: 0, y: 0 };

function genCode() {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let out = "";
  for (let i = 0; i < 4; i++) out += chars[Math.floor(Math.random() * chars.length)];
  return out;
}

$('createBtn').onclick = () => {
  myName = cleanStr($('nameInput').value) || "Player";
  isHost = true;
  roomCode = genCode();
  state.players = [{
    id: myId, name: myName,
    emoji: AVATARS[0].emoji, color: AVATARS[0].color,
    wins: 0, out: false
  }];
  openLobby();
};

$('joinBtn').onclick = () => {
  myName = cleanStr($('nameInput').value) || "Player";
  const code = $('codeInput').value.trim().toUpperCase().replace(/[^A-Z0-9]/g, "");
  if (code.length < 3) { alert("Please enter a valid 4-character room code."); return; }
  isHost = false;
  roomCode = code;
  openLobby();
};

$('copyBtn').onclick = () => {
  navigator.clipboard?.writeText(roomCode);
  $('copyBtn').textContent = "✅ Copied: " + roomCode;
  setTimeout(() => { $('copyBtn').textContent = "📋 Copy Room Code"; }, 1500);
};

$('startBtn').onclick = () => {
  if (!isHost || state.players.length < 2) return;
  if (state.phase === "over") {
    state.players.forEach(p => { p.wins = 0; p.out = false; });
    state.round = 0;
    state.championId = null;
  }
  startNextRound();
};

function openLobby() {
  $('menuScreen').classList.add('hidden');
  $('lobbyScreen').classList.remove('hidden');$('lobbyCode').textContent = roomCode;
  renderLobby();
  connectMQTT();
}

function connectMQTT() {
  topic = `potato_panic_2b_${roomCode}`;
  client = mqtt.connect(BROKER, {
    clientId: `pp_${myId}_${Math.random().toString(16).slice(2, 6)}`,
    clean: true,
    keepalive: 45,
    reconnectPeriod: 1500
  });

  client.on('connect', () => {
    $('connStatus').textContent = "🟢 Connected";
    $('connStatus').style.color = "#4ade80";
    client.subscribe(topic, { qos: 0 }, () => {
      if (isHost) {
        broadcastState();
        if (!hostLoopTimer) hostLoopTimer = setInterval(hostTick, 80);
      } else {
        requestJoin();
        if (!joinRetryTimer) joinRetryTimer = setInterval(requestJoin, 2000);
      }
    });
  });

  client.on('reconnect', () => {
    $('connStatus').textContent = "🟡 Reconnecting...";
    $('connStatus').style.color = "#facc15";
  });

  client.on('message', (t, payload) => {
    if (t !== topic) return;
    let msg;
    try { msg = JSON.parse(payload.toString()); } catch (e) { return; }
    if (!msg || msg.s === myId) return;

    if (msg.t === "P") {
      updateRemotePos(msg.s, msg.x, msg.y, msg.vx, msg.vy);
    } else if (msg.t === "TAG") {
      if (isHost) {
        handleTagReq(msg.f, msg.to);
      } else if (state.phase === "play" && state.holderId === msg.f) {
        // Optimistic tag update for all clients immediately
        state.holderId = msg.to;
        $('banner').textContent = `🔥 ${getPlayerName(msg.to)} got tagged with the bomb!`;
      }
    } else if (msg.t === "SYNC") {
      applyStateSync(msg);
    } else if (msg.t === "JOIN" && isHost) {
      handleJoinReq(msg);
    }
  });
}

function publishMsg(obj) {
  if (!client || !client.connected) return;
  obj.s = myId;
  client.publish(topic, JSON.stringify(obj));
}

function requestJoin() {
  if (state.players.some(p => p.id === myId)) {
    clearInterval(joinRetryTimer);
    return;
  }
  publishMsg({ t: "JOIN", id: myId, name: myName });
}

function handleJoinReq(msg) {
  const existing = state.players.find(p => p.id === msg.id);
  if (!existing) {
    if (state.players.length >= MAX_PLAYERS || state.phase !== "lobby") return;
    const av = AVATARS[state.players.length % AVATARS.length];
    state.players.push({
      id: msg.id,
      name: cleanStr(msg.name) || "Player",
      emoji: av.emoji,
      color: av.color,
      wins: 0,
      out: false
    });
  }
  broadcastState();
}

function broadcastState(resetMode = false) {
  if (resetMode) {
    state.stateVersion += 1;
    bombTimerStart = performance.now();
  }
  const elapsed = Math.round(performance.now() - bombTimerStart);
  syncUI();
  publishMsg({
    t: "SYNC",
    state,
    el: elapsed,
    sp: resetMode === "round_start"
  });
}

function applyStateSync(msg) {
  state = msg.state;
  bombTimerStart = performance.now() - (msg.el || 0);
  if (msg.sp) {
    placePlayersInCircle();
  }
  syncUI();
}

function placePlayersInCircle() {
  const count = state.players.length;
  state.players.forEach((p, idx) => {
    const angle = (idx / count) * Math.PI * 2;
    const px = Math.round(ARENA_W / 2 + Math.cos(angle) * 240);
    const py = Math.round(ARENA_H / 2 + Math.sin(angle) * 150);
    positions.set(p.id, { x: px, y: py, tx: px, ty: py, vx: 0, vy: 0, lastUpdate: performance.now() });
    if (p.id === myId) {
      myPos.x = px;
      myPos.y = py;
      myPos.vx = 0;
      myPos.vy = 0;
    }
  });
}

function startNextRound() {
  state.round += 1;
  state.phase = "play";
  state.players.forEach(p => { p.out = false; });
  const randomIdx = Math.floor(Math.random() * state.players.length);
  state.holderId = state.players[randomIdx].id;
  state.bombDuration = 9500 + Math.floor(Math.random() * 4000);
  state.lastEventText = `Round ${state.round} — ${getPlayerName(state.holderId)} has the bomb!`;
  placePlayersInCircle();
  lastTagTime = Date.now() + 900;
  broadcastState("round_start");
}

function handleTagReq(fromId, toId) {
  if (state.phase !== "play" || state.holderId !== fromId) return;
  const now = Date.now();
  if (now - lastTagTime < 750) return;
  const target = state.players.find(p => p.id === toId && !p.out);
  if (!target) return;

  lastTagTime = now;
  state.holderId = toId;
  state.lastEventText = `🔥 ${target.name} got tagged with the bomb!`;
  broadcastState(false);
}

function hostTick() {
  if (!isHost || state.phase !== "play") return;
  const elapsed = performance.now() - bombTimerStart;
  if (elapsed < state.bombDuration) return;

  const victim = state.players.find(p => p.id === state.holderId);
  if (victim) victim.out = true;

  const alive = state.players.filter(p => !p.out);
  if (alive.length <= 1) {
    const winner = alive[0];
    if (winner) {
      winner.wins += 1;
      if (winner.wins >= WIN_ROUNDS) {
        state.phase = "over";
        state.championId = winner.id;
        state.holderId = null;
        state.lastEventText = `👑 ${winner.name} wins the match!`;
        broadcastState(false);
        return;
      }
      state.lastEventText = `🏆 ${winner.name} won Round ${state.round}!`;
    }
    startNextRound();
  } else {
    const nextHolder = alive[Math.floor(Math.random() * alive.length)];
    state.holderId = nextHolder.id;
    state.bombDuration = 8500 + Math.floor(Math.random() * 4000);
    state.lastEventText = `💥 ${victim ? victim.name : "Player"} exploded! Bomb on ${nextHolder.name}!`;
    lastTagTime = Date.now() + 900;
    broadcastState(true);
  }
}

function getPlayerName(id) {
  return state.players.find(p => p.id === id)?.name || "Player";
}

function renderLobby() {
  const isOver = state.phase === "over";
  $('lobbyTitle').textContent = isOver
    ? `👑 ${getPlayerName(state.championId)} Wins!`
    : "💣 Room Lobby";

  $('playerList').innerHTML = state.players.map((p, i) => `
    <div class="player-item">
      <span>${p.emoji} ${p.name} ${p.id === myId ? "(You)" : ""} ${i === 0 ? "👑" : ""}</span>
      <span style="color:#facc15">🏆 ${p.wins}</span>
    </div>
  `).join("");

  if (isHost) {
    const canStart = state.players.length >= 2;
    $('startBtn').disabled = !canStart;
    $('startBtn').textContent = canStart
      ? (isOver ? "🔁 Play New Match" : `🔥 Start Match (${state.players.length} Players)`)
      : "Waiting for at least 2 players...";
  } else {
    $('startBtn').disabled = true;
    $('startBtn').textContent = state.players.some(p => p.id === myId)
      ? "Waiting for Host to start..."
      : "Joining room...";
  }
}

function syncUI() {
  if (state.phase === "lobby" || state.phase === "over") {
    $('lobbyScreen').classList.remove('hidden');
    $('hudTop').classList.add('hidden');$('banner').classList.add('hidden');
    renderLobby();
    return;
  }

  $('lobbyScreen').classList.add('hidden');
  $('hudTop').classList.remove('hidden');$('banner').classList.remove('hidden');

  $('roundInfo').textContent = `Round ${state.round} · First to ${WIN_ROUNDS} 🏆`;
  $('scoreInfo').textContent = state.players.map(p => `${p.emoji}${p.wins}`).join("  ");
  $('banner').textContent = state.lastEventText || "Run!";
}

function updateRemotePos(id, x, y, vx = 0, vy = 0) {
  let pos = positions.get(id);
  const now = performance.now();
  if (!pos) {
    positions.set(id, { x, y, tx: x, ty: y, vx, vy, lastUpdate: now });
  } else {
    pos.tx = x;
    pos.ty = y;
    pos.vx = vx;
    pos.vy = vy;
    pos.lastUpdate = now;
  }
}

/* INPUT, DEAD RECKONING & RENDERING */
const cv = $('gameCanvas');
const ctx = cv.getContext('2d');
let dpr = 1, scale = 1, offX = 0, offY = 0;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = window.innerWidth * dpr;
  cv.height = window.innerHeight * dpr;
  scale = Math.min(window.innerWidth / ARENA_W, window.innerHeight / ARENA_H) * 0.94;
  offX = (window.innerWidth - ARENA_W * scale) / 2;
  offY = (window.innerHeight - ARENA_H * scale) / 2;
}
window.addEventListener('resize', resize);
resize();

window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; });
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

cv.addEventListener('pointerdown', e => {
  if (state.phase !== "play") return;
  joy.active = true;
  joy.ox = joy.x = e.clientX;
  joy.oy = joy.y = e.clientY;
});
cv.addEventListener('pointermove', e => {
  if (joy.active) { joy.x = e.clientX; joy.y = e.clientY; }
});
const stopJoy = () => { joy.active = false; };
cv.addEventListener('pointerup', stopJoy);
cv.addEventListener('pointercancel', stopJoy);

function updateGame(dt, nowPerf) {
  if (state.phase !== "play") return;

  const meObj = state.players.find(p => p.id === myId);
  if (meObj && !meObj.out) {
    let dx = (keys['d'] || keys['arrowright'] ? 1 : 0) - (keys['a'] || keys['arrowleft'] ? 1 : 0);
    let dy = (keys['s'] || keys['arrowdown'] ? 1 : 0) - (keys['w'] || keys['arrowup'] ? 1 : 0);

    if (joy.active) {
      const jx = joy.x - joy.ox;
      const jy = joy.y - joy.oy;
      const dist = Math.hypot(jx, jy);
      if (dist > 6) {
        dx = jx / dist;
        dy = jy / dist;
      }
    }

    const len = Math.hypot(dx, dy);
    const speed = (state.holderId === myId) ? 175 : 240;

    if (len > 0) {
      dx /= len;
      dy /= len;
      myPos.vx = dx * speed;
      myPos.vy = dy * speed;
      myPos.x = Math.max(PLAYER_R, Math.min(ARENA_W - PLAYER_R, myPos.x + myPos.vx * dt));
      myPos.y = Math.max(PLAYER_R, Math.min(ARENA_H - PLAYER_R, myPos.y + myPos.vy * dt));
      positions.set(myId, { x: myPos.x, y: myPos.y, tx: myPos.x, ty: myPos.y, vx: myPos.vx, vy: myPos.vy, lastUpdate: nowPerf });

      // Send position + velocity every 70ms (~14.2 ticks/sec) while moving
      if (nowPerf - lastSentTime >= 70) {
        lastSentTime = nowPerf;
        publishMsg({
          t: "P",
          x: Math.round(myPos.x),
          y: Math.round(myPos.y),
          vx: Math.round(myPos.vx),
          vy: Math.round(myPos.vy)
        });
      }
      wasMoving = true;
    } else if (wasMoving) {
      // Immediately send a final stop packet so remote clients stop dead-reckoning
      myPos.vx = 0;
      myPos.vy = 0;
      wasMoving = false;
      lastSentTime = nowPerf;
      publishMsg({
        t: "P",
        x: Math.round(myPos.x),
        y: Math.round(myPos.y),
        vx: 0,
        vy: 0
      });
    }

    // Tag Check with optimistic local transfer
    if (state.holderId === myId && Date.now() - lastTagTime > 750) {
      for (const p of state.players) {
        if (p.id === myId || p.out) continue;
        const rPos = positions.get(p.id);
        if (!rPos) continue;
        if (Math.hypot(rPos.x - myPos.x, rPos.y - myPos.y) < PLAYER_R * 2.2) {
          lastTagTime = Date.now();
          state.holderId = p.id;
          $('banner').textContent = `🔥 ${p.name} got tagged with the bomb!`;
          publishMsg({ t: "TAG", f: myId, to: p.id });
          if (isHost) handleTagReq(myId, p.id);
          break;
        }
      }
    }
  }

  // Dead Reckoning + Frame-Rate Independent Smoothing for Remote Players
  const blend = 1 - Math.exp(-18 * dt);
  for (const [id, pos] of positions) {
    if (id === myId) continue;
    // Predict target movement using velocity for up to 250ms after last packet
    if (nowPerf - (pos.lastUpdate || 0) < 250) {
      pos.tx = Math.max(PLAYER_R, Math.min(ARENA_W - PLAYER_R, pos.tx + (pos.vx || 0) * dt));
      pos.ty = Math.max(PLAYER_R, Math.min(ARENA_H - PLAYER_R, pos.ty + (pos.vy || 0) * dt));
    }
    pos.x += (pos.tx - pos.x) * blend;
    pos.y += (pos.ty - pos.y) * blend;
  }
}

function drawGame() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = "#0f172a";
  ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

  if (state.phase !== "play") return;

  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * offX, dpr * offY);

  ctx.fillStyle = "#1e293b";
  ctx.fillRect(0, 0, ARENA_W, ARENA_H);
  ctx.strokeStyle = "#334155";
  ctx.lineWidth = 4;
  ctx.strokeRect(0, 0, ARENA_W, ARENA_H);

  const timeLeftSec = Math.max(0, Math.ceil((state.bombDuration - (performance.now() - bombTimerStart)) / 1000));

  for (const p of state.players) {
    if (p.out) continue;
    const pos = positions.get(p.id) || { x: ARENA_W / 2, y: ARENA_H / 2 };
    const isHolder = state.holderId === p.id;

    ctx.save();
    ctx.translate(pos.x, pos.y);

    if (isHolder) {
      ctx.beginPath();
      ctx.arc(0, 0, PLAYER_R + 8, 0, Math.PI * 2);
      ctx.strokeStyle = "#ef4444";
      ctx.lineWidth = 4;
      ctx.stroke();
    }

    ctx.beginPath();
    ctx.arc(0, 0, PLAYER_R, 0, Math.PI * 2);
    ctx.fillStyle = p.color;
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = p.id === myId ? "#ffffff" : "#0f172a";
    ctx.stroke();

    ctx.font = "20px system-ui, sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(p.emoji, 0, 1);

    ctx.font = "bold 13px system-ui, sans-serif";
    ctx.fillStyle = "#f8fafc";
    ctx.fillText(p.name, 0, -PLAYER_R - 10);

    if (isHolder) {
      ctx.font = "900 18px system-ui, sans-serif";
      ctx.fillStyle = "#ef4444";
      ctx.fillText(`💣 ${timeLeftSec}s`, 0, -PLAYER_R - 28);
    }

    ctx.restore();
  }

  if (joy.active) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.beginPath();
    ctx.arc(joy.ox, joy.oy, 45, 0, Math.PI * 2);
    ctx.strokeStyle = "rgba(255,255,255,0.25)";
    ctx.lineWidth = 3;
    ctx.stroke();

    let dx = joy.x - joy.ox, dy = joy.y - joy.oy;
    const dist = Math.hypot(dx, dy);
    if (dist > 45) { dx = (dx / dist) * 45; dy = (dy / dist) * 45; }
    ctx.beginPath();
    ctx.arc(joy.ox + dx, joy.oy + dy, 18, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(250, 204, 21, 0.45)";
    ctx.fill();
  }
}

let lastTime = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;
  updateGame(dt, now);
  drawGame();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
